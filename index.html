/* ===================== IA: describir lo que has comido ===================== */
// Precios por millón de tokens (entrada / salida), para estimar el gasto de cada consulta.
const AI_MODELS = {
  'claude-opus-5-5':  {n:'Claude Opus 5.5',  d:'el más preciso', in:4,    out:20,   fallback:true},
  'claude-sonnet-5-5':{n:'Claude Sonnet 5.5',d:'equilibrado',    in:2,    out:10,   fallback:true},
  'claude-haiku-5-5': {n:'Claude Haiku 5.5', d:'el más barato',  in:0.10, out:0.50, fallback:false},
};
const AI_KEY = 'dieta.aikey'; // fuera del estado: no viaja en las copias de seguridad
function aiKey(){ try{ return localStorage.getItem(AI_KEY) || ''; }catch(_){ return ''; } }
function aiCostHint(model){ const p = AI_MODELS[model]; return '~' + ((2500*p.in + 700*p.out) / 1e6).toFixed(3).replace('.', ',') + ' $'; }
let _Anthropic = null;
async function loadSDK(){
  if (!_Anthropic) _Anthropic = (await import('https://esm.sh/@anthropic-ai/sdk@0.131.0')).default;
  return _Anthropic;
}
function aiSystem(){
  // Solo los alimentos base: el texto es siempre igual (la lista de Mercadona va en cada consulta, recortada).
  const db = Object.entries(FOODS).filter(([id,F]) => F.sec && !F.mid).map(([id,F]) =>
    `${id}: ${F.n} — por 100 ${F.ml?'ml':'g'}: ${F.k} kcal, ${F.p} g prot, ${F.c} g hidratos, ${F.f} g grasa${F.u ? ` (1 unidad ≈ ${F.u} g)` : ''}`).join('\n');
  return `Eres el asistente de nutrición de una app de dieta personal. El usuario cuenta (a veces con una foto) lo que ha comido en una comida concreta. Conviertes eso en un registro fiable, porque la app recalcula con él el resto del día: si sobrestimas o infraestimas, las siguientes comidas salen mal ajustadas.

Base de datos de alimentos de la app:
${db}

Cómo rellenar la respuesta:
- accion: "hecha" si comió lo del plan tal cual; "cambios" si es el plan con modificaciones; "otra" si comió algo distinto; "saltada" si no comió.
- items: alimentos de la base de datos con sus gramos. En "hecha" y "cambios" pon la lista completa de lo que comió de verdad, no solo lo que cambia. El arroz y la pasta de la base de datos están en crudo: si te dan cantidades cocinadas, conviértelas (1 g crudo ≈ 2,5–3 g cocido). Huevos y fruta en gramos (usa el peso por unidad).
- productos_mercadona: en cada consulta la app añade productos reales de Mercadona (donde compra el usuario) cuyo nombre se parece a lo que cuenta, con los macros de su etiqueta. Es una preselección automática por palabras, así que puede traer productos que no tienen nada que ver: ignóralos. Si lo que comió es claramente uno de ellos, pon su id en items con los gramos, porque es más exacto que estimar. Si no coincide ninguno, usa la base de datos de arriba o extras. "sin_escurrir" quiere decir que sus valores incluyen el aceite de la lata.
- extras: lo que no esté en la base de datos, con gramos y macros totales de esa cantidad. Usa raciones típicas de España si no se dicen. En comidas de restaurante o fritos cuenta el aceite que no se ve.
- hora: "HH:MM" si la menciona; si no, cadena vacía.
- confianza: "baja" si has tenido que suponer bastante.
- resumen: una frase corta en español con lo registrado.
- consejo: como mucho una frase útil para el resto del día, o cadena vacía. No sermonees.`;
}
function aiSchema(extraIds = []){
  const ids = Object.keys(FOODS).filter(id => FOODS[id].sec && !FOODS[id].mid).concat(extraIds);
  return {
    type:'object', additionalProperties:false,
    required:['accion','items','extras','hora','confianza','resumen','consejo'],
    properties:{
      accion:{type:'string', enum:['hecha','cambios','otra','saltada']},
      items:{type:'array', items:{type:'object', additionalProperties:false, required:['id','g'], properties:{id:{type:'string', enum:ids}, g:{type:'number'}}}},
      extras:{type:'array', items:{type:'object', additionalProperties:false, required:['nombre','g','kcal','p','c','f'],
        properties:{nombre:{type:'string'}, g:{type:'number'}, kcal:{type:'number'}, p:{type:'number'}, c:{type:'number'}, f:{type:'number'}}}},
      hora:{type:'string'}, confianza:{type:'string', enum:['alta','media','baja']},
      resumen:{type:'string'}, consejo:{type:'string'},
    },
  };
}
// Llamada común a Claude: salida estructurada con el esquema dado, respaldo ante rechazos y registro del gasto.
async function aiCall(system, content, schema){
  const Anthropic = await loadSDK();
  const client = new Anthropic({apiKey: aiKey(), dangerouslyAllowBrowser: true});
  const model = AI_MODELS[S.settings.aiModel] ? S.settings.aiModel : 'claude-opus-5-5';
  const params = {model, max_tokens:8000, system, messages:[{role:'user', content}],
    output_config:{effort:'low', format:{type:'json_schema', schema}}};
  let res;
  if (AI_MODELS[model].fallback) res = await client.beta.messages.create(Object.assign(params, {betas:['server-side-fallback-2026-07-01'], fallbacks:'default'}));
  else res = await client.messages.create(params);
  const u = res.usage || {}, p = AI_MODELS[model];
  S.ai.spent[model] = (S.ai.spent[model] || 0) + ((u.input_tokens || 0) * p.in + (u.output_tokens || 0) * p.out) / 1e6;
  S.ai.calls[model] = (S.ai.calls[model] || 0) + 1; save();
  if (res.stop_reason === 'refusal') throw new Error('La IA no ha querido responder a esto. Usa las opciones manuales.');
  if (res.stop_reason === 'max_tokens') throw new Error('La respuesta de la IA se cortó. Prueba con algo más corto.');
  return JSON.parse(res.content.filter(b => b.type === 'text').map(b => b.text).join(''));
}
async function aiAnalyze({m, items, text, photo, at, fuera}){
  // Preselección local: los ~20 productos de Mercadona que más se parecen a lo que cuenta (y los que ya usa).
  // Si ha comido fuera no se buscan: lo de un bar o restaurante no es de Mercadona y va con valores genéricos.
  let cand = [];
  if (text && !fuera){ try{ await loadMDB(); cand = candidatesFor(text); }catch(_){} }
  if (!fuera) items.forEach(it => { if (FOODS[it.id] && FOODS[it.id].mid && !cand.includes(it.id)) cand.push(it.id); });
  const prods = cand.map(id => { const F = useMDB(id) || FOODS[id]; const o = {id, nombre:F.n, por_100:{kcal:F.k, p:F.p, c:F.c, f:F.f}};
    if (F.ml) o.liquido = true; if (F.u) o.unidad_g = F.u; if (F.tal) o.sin_escurrir = true; return o; });
  const ctx = {comida: MEAL_NAME[m], hora_actual: fmt(nowMin()), hora_elegida_en_la_app: fmt(at),
    plan_de_esta_comida: items.map(it => ({id: it.id, alimento: dispName(it.id), g: R(it.g)})),
    productos_mercadona: prods};
  if (fuera) ctx.comido_fuera = 'Ha comido FUERA de casa (bar, restaurante, casa de otros). No es de Mercadona ni de su despensa: pon TODO en extras, con valores genéricos de una tabla de composición española (tipo BEDCA) para ese alimento y esa forma de cocinarlo, y deja items vacío. Usa raciones típicas de España si no las dice y cuenta el aceite de la plancha o la fritura. Ejemplo: «choco a la plancha» → choco/sepia a la plancha, no un producto parecido.';
  const content = [];
  if (photo) content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data:photo}});
  content.push({type:'text', text:`Contexto de la app:\n${JSON.stringify(ctx)}\n\nLo que cuenta el usuario:\n${text || '(sin texto: usa la foto)'}`});
  return aiCall(aiSystem(), content, aiSchema(cand));
}
function aiErrorText(e){
  const A = _Anthropic;
  if (A && e instanceof A.AuthenticationError) return 'La API key no es válida. Revísala en Ajustes.';
  if (A && e instanceof A.PermissionDeniedError) return 'Tu key no tiene acceso a ese modelo. Prueba otro en Ajustes.';
  if (A && e instanceof A.RateLimitError) return 'Demasiadas consultas seguidas. Espera un momento.';
  if (A && e instanceof A.BadRequestError) return 'Anthropic ha rechazado la consulta: ' + e.message;
  if (A && e instanceof A.APIConnectionError) return 'Sin conexión con la IA. Usa las opciones manuales.';
  if (A && e instanceof A.APIError) return 'Error de la IA: ' + e.message;
  if (e instanceof SyntaxError) return 'No he entendido la respuesta de la IA. Vuelve a intentarlo.';
  if (!A) return 'No se ha podido cargar la IA (¿sin conexión?).';
  return e.message || 'Algo ha fallado.';
}
function readPhoto(file){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1024 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = ko; img.src = url;
  });
}

function sheetAIReview(m, r, at){
  const items = (r.items || []).filter(it => FOODS[it.id] && it.g > 0).map(it => ({id:it.id, g:it.g}));

  const draw = el => {

  sheet(`<h2>${MEAL_NAME[m]}: ${label.toLowerCase()}</h2>

    <div class="sub">${esc(r.resumen || '')} <span class="badge ${r.confianza==='baja'?'late':''}">confianza ${esc(r.confianza || 'media')}</span></div>

      const i = e.target.dataset.i; if (i == null) return; const F = FOODS[items[i].id], v = parseFloat(e.target.value) || 0; items[i].g = F.u ? v*F.u : v; const t = consumedOf({status:'changed', items, extra:extras}); el.querySelector('#rvsum').textContent = `${R(t.k)} kcal · ${R(t.p)} g proteína · ${R(t.c)} g hidratos · ${R(t.f)} g grasa`; });

    });
  });

/* ===================== IA: «¿Cómo completo lo que me falta?» ===================== */
// Para una comida pendiente: la IA propone 1–3 versiones completas de esa comida que cuadran el día,
// usando primero lo que hay en casa y, si hace falta, productos de Mercadona. Cada opción se puede aplicar
// a la comida (cantidades fijadas, sin marcarla como hecha) y el resto del día se recoloca.
const enCasa = id => !noHay(id) && (FOODS_BASE[id] ? !!FOODS[id].sec : !!(S.despensa || {})[id]);
function coachContext(m){
  const D = computeDay(viewDay()), M = D.meals[m];
  const T = {k: D.TK, p: +S.settings.prot || D.target.p, c: D.target.c, f: D.target.f};
  const otras = D.sch.order.filter(x => x !== m && D.meals[x].status === 'pending' && !D.meals[x].merged)
    .reduce((a, x) => addM(a, sumItems(D.meals[x].items)), ZERO);
  const cubrir = addM(addM(T, D.consumed, -1), otras, -1);
  return {D, M, T, otras, cubrir, ahora: sumItems(M.items)};
}
const macrosTxt = x => ({kcal: R(x.k), proteina_g: R(x.p), hidratos_g: R(x.c), grasa_g: R(x.f)});
function foodRow(id, casa){
  const F = useMDB(id) || FOODS[id], o = {id, nombre: F.n, por_100: {kcal: F.k, p: F.p, c: F.c, f: F.f}};
  if (F.u) o.unidad_g = F.u; if (F.ml) o.liquido = true; if (F.tal) o.sin_escurrir = true; if (F.s === 'c') o.en_crudo = true;
  if (casa) o.en_casa = true;
  return o;
}
function coachSystem(){
  return `Eres el asistente de nutrición de una app de dieta personal. El usuario es un chico de 26 años en volumen lento que entrena fuerza; la proteína es lo prioritario. Para UNA comida concreta propones cómo completarla para que el día llegue a sus objetivos.

Recibes: lo que debería aportar esta comida ("a_cubrir_en_esta_comida", ya descontado lo que ha comido hoy y lo que aportarán las demás comidas pendientes), lo que lleva ahora, su despensa (alimentos con "en_casa") y una preselección de productos de Mercadona, donde compra.

Cómo responder:
- Propón de 1 a 3 opciones distintas entre sí. Cada opción es la lista COMPLETA de lo que comería en esta comida: puedes mantener, quitar o cambiar los gramos de lo que ya lleva. Usa solo ids de las listas.
- El total de cada opción debe quedar cerca de "a_cubrir_en_esta_comida": proteína a ±5 g y kcal a ±10 %. Si no se puede (por ejemplo, falta mucha proteína y quedan pocas kcal), prioriza la proteína y dilo en la respuesta. Si lo que falta es negativo, la comida debe ser más ligera.
- Usa primero lo que tiene en casa. Si propones algo que no tiene, dilo en la explicación ("habría que comprar…").
- Cantidades realistas para una comida y fáciles de pesar. Arroz y pasta en crudo. Huevos, latas y piezas en gramos, usando unidad_g.
- Haz caso a lo que pide el usuario: tiempo, cocinar o no, gustos, lo que no le apetece o lo que ya ha comido hoy.
- respuesta: 1–2 frases. explicacion de cada opción: una frase práctica (cómo prepararla o qué comprar). En español y sin sermones.`;
}
function coachSchema(ids){
  return {type:'object', additionalProperties:false, required:['respuesta', 'opciones'], properties:{
    respuesta:{type:'string'},
    opciones:{type:'array', items:{type:'object', additionalProperties:false, required:['titulo', 'items', 'explicacion'], properties:{
      titulo:{type:'string'}, explicacion:{type:'string'},
      items:{type:'array', items:{type:'object', additionalProperties:false, required:['id', 'g'], properties:{id:{type:'string', enum:ids}, g:{type:'number'}}}},
    }}},
  }};
}
async function coachAsk(m, pregunta, previa){
  const C = coachContext(m);
  try{ await loadMDB(); }catch(_){}
  // despensa: alimentos base que hay en casa + otros productos de la despensa
  const casa = Object.keys(FOODS_BASE).filter(id => enCasa(id)).concat(Object.keys(S.despensa || {}).filter(id => FOODS[id] && enCasa(id)));
  // Mercadona: lo que se parezca a la pregunta y, según lo que falte, algunos básicos de cada grupo
  let merc = [];
  if (MDB){
    const add = ids => ids.forEach(id => { if (!casa.includes(id) && !merc.includes(id) && useMDB(id) && FOODS[id].q !== 'b') merc.push(id); });
    if (pregunta) add(candidatesFor(pregunta, 12));
    if (C.cubrir.p > 10) add(searchFoods('pechuga pavo pollo atun claras merluza yogur proteinas queso batido', {group:'prot', limit:8, base:false}));
    if (C.cubrir.c > 25) add(searchFoods('arroz pasta patata pan tortitas avena', {group:'carb', limit:5, base:false}));
    if (C.cubrir.f > 10) add(searchFoods('aceite nueces almendra aguacate', {group:'grasa', limit:3, base:false}));
    merc = merc.slice(0, 26);
  }
  const ctx = {
    comida: MEAL_NAME[C.M.key], hora_prevista: fmt(C.M.t), hora_actual: fmt(nowMin()),
    objetivo_del_dia: macrosTxt(C.T), comido_hoy: macrosTxt(C.D.consumed),
    otras_comidas_pendientes_aportan: macrosTxt(C.otras),
    a_cubrir_en_esta_comida: macrosTxt(C.cubrir),
    esta_comida_ahora: C.M.items.filter(x => !x.fromBatido).map(x => ({id:x.id, alimento:dispName(x.id), g:R(x.g)})),
    despensa_en_casa: casa.map(id => foodRow(id, true)),
    productos_mercadona: merc.map(id => foodRow(id, false)),
  };
  if (previa) ctx.conversacion_previa = previa;
  const ids = [...new Set(casa.concat(merc, C.M.items.map(x => x.id)))];
  const content = [{type:'text', text:`Contexto de la app:\n${JSON.stringify(ctx)}\n\nPregunta del usuario:\n${pregunta || '¿Cómo completo esta comida para llegar a mis objetivos?'}`}];
  const r = await aiCall(coachSystem(), content, coachSchema(ids));
  r.opciones = (r.opciones || []).slice(0, 3).map(o => ({...o, items:(o.items || []).filter(it => FOODS[it.id] && it.g > 0).map(it => ({id:it.id, g:Math.round(it.g)}))})).filter(o => o.items.length);
  return {r, C};
}

  });
}

/* ===================== Swipe para marcar hecha ===================== */
// Pulsación larga en un alimento de una comida pendiente → «Mover a…» otra comida pendiente
let lp = null, lpFired = false;
function bindLongPress(){
  app.querySelectorAll('li[data-move]').forEach(li => {
    li.addEventListener('pointerdown', e => {
      clearTimeout(lp && lp.t); lpFired = false; li.classList.add('hold');
      lp = {x:e.clientX, y:e.clientY, li, t:setTimeout(() => { lpFired = true; li.classList.remove('hold'); try{ navigator.vibrate && navigator.vibrate(25); }catch(_){} sheetMove(li.dataset.move, +li.dataset.i); }, 500)};
    });
    const cancel = () => { if (lp && lp.li === li){ clearTimeout(lp.t); lp = null; } li.classList.remove('hold'); };
    li.addEventListener('pointermove', e => { if (lp && lp.li === li && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) cancel(); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev => li.addEventListener(ev, cancel));
    li.addEventListener('contextmenu', e => e.preventDefault());
  });
}
// el clic que llega al soltar tras una pulsación larga no debe abrir el intercambio ni tocar cantidades
document.addEventListener('click', e => { if (lpFired){ lpFired = false; e.stopPropagation(); e.preventDefault(); } }, true);
function sheetMove(m, i){
  const k = viewDay(), D = computeDay(k), it = D.meals[m].items[i]; if (!it) return;
  const dest = D.sch.order.filter(x => x !== m && D.meals[x].status === 'pending' && !D.meals[x].merged);
  sheet(`<h2>Mover ${esc(dispName(it.id).toLowerCase())}</h2><div class="sub">${amount(it.id, it.g)} de ${MEAL_NAME[m].toLowerCase()} a otra comida. El total del día no cambia.</div>
    <div class="stack">${dest.length ? dest.map(x => `<button class="opt" data-to="${x}"><span>${MEAL_NAME[x]}</span><span class="d num">${fmt(D.meals[x].t)}</span></button>`).join('') : '<div class="empty">No hay otra comida pendiente a la que moverlo.</div>'}</div>
    <div class="evactions"><button class="btn ghost" data-x="cancel">Cancelar</button></div>`, el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-x]')) return closeSheet();
      const b = e.target.closest('[data-to]'); if (!b) return;
      const to = b.dataset.to, day = getDay(k), snap = structuredClone({pe: day.planEdit || {}, ml: day.meals});
      const src = planItems(m), dst = planItems(to), [mv] = src.splice(i, 1);
      dst.push({id:mv.id, g:mv.g, mf:m});
      // si la comida se queda vacía, cuenta como hecha junto con la otra (no como saltada)
      if (!src.length) day.meals[m] = {status:'moved', to, items:[]};
      save(); closeSheet(); render();
      toast(`${FOODS[mv.id].n} → ${MEAL_NAME[to].toLowerCase()}`, () => { day.planEdit = snap.pe; day.meals = snap.ml; save(); render(); });
    });
  });
}
// «Deshacer» en una comida que se movió entera: vuelve a su plan y se quita lo que se había pasado a la otra
function undoMove(m){
  const day = getDay(viewDay()), to = day.meals[m].to;
  delete day.meals[m]; if (day.planEdit) delete day.planEdit[m];
  if (day.planEdit && day.planEdit[to]){ day.planEdit[to] = day.planEdit[to].filter(x => x.mf !== m); }
  save(); render(); toast(MEAL_NAME[m] + ' vuelve a su plan');
}
function bindSwipes(){
  app.querySelectorAll('.ev[data-swipe]').forEach(ev => {
    const m = ev.dataset.swipe; if (!m) return;
    const card = ev.querySelector('.card'), bg = ev.querySelector('.swipebg');
    let x0 = null, y0 = null, dx = 0, active = false;
    ev.addEventListener('pointerdown', e => { if (e.target.closest('button,input,select')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; active = false; });
    ev.addEventListener('pointermove', e => {
      if (x0 == null) return;
      const ddx = e.clientX - x0, ddy = e.clientY - y0;
      if (!active && Math.abs(ddx) > 12 && Math.abs(ddx) > Math.abs(ddy)*1.5){ active = true; ev.classList.add('drag'); try{ ev.setPointerCapture(e.pointerId); }catch(_){} }
      if (!active) return;
      dx = Math.max(0, ddx); card.style.transform = `translateX(${dx}px)`; bg.style.opacity = Math.min(1, dx/110);
    });
    const end = () => {
      if (x0 == null) return; x0 = null; ev.classList.remove('drag');
      if (active && dx > 110){ card.style.transform = 'translateX(110%)'; setTimeout(()=>logMeal(m, 'done'), 120); }
      else { card.style.transform = ''; bg.style.opacity = 0; }
      active = false;
    };
    ev.addEventListener('pointerup', end); ev.addEventListener('pointercancel', end);
  });
}

/* ===================== Despensa y compra ===================== */
function weeklyNeeds(){
  const need = {};
  const add = (arr, mult=1) => arr.forEach(([id,g]) => need[id] = (need[id]||0) + g*mult);
  for (let wd = 0; wd < 7; wd++){ add(DESAYUNO); add(WEEK[wd].almuerzo); add(WEEK[wd].cena); }
  add(BATIDO, 7);
  return need;
}
let despQuery = '';
function renderCompra(){
  const need = weeklyNeeds();
  const baseIds = Object.keys(FOODS_BASE).filter(id => FOODS[id].sec && S.pantry[id] !== 'fuera' && (need[id] || S.pantry[id] === 'falta'));
  const quitados = Object.keys(FOODS_BASE).filter(id => S.pantry[id] === 'fuera');
  const extra = Object.keys(S.despensa || {}).filter(id => FOODS[id]).sort((a, b) => FOODS[a].n.localeCompare(FOODS[b].n));
  const falta = baseIds.concat(extra).filter(id => S.pantry[id] === 'falta');
  const bySec = {}; baseIds.forEach(id => (bySec[FOODS[id].sec] = bySec[FOODS[id].sec] || []).push(id));
  const q = id => need[id] ? `${amount(id, need[id])} / semana` : (FOODS[id].mid ? GROUP_NAME[FOODS[id].g] || '' : 'fuera del plan');
  const brand = id => FOODS[id].brand ? `<div class="q">🛒 ${esc(FOODS[id].brand)}</div>` : '';
  const tog = id => { const f = S.pantry[id] === 'falta'; return `<button class="tog ${f?'falta':''}" data-act="pantry" data-id="${id}">${f?'Se acabó':'Hay'}</button>`; };
  let h = `<header class="top"><div><h1>Despensa</h1><div class="sub">Lo que tienes en casa. Si algo se acaba, la app lo cambia por un equivalente, empezando por lo que tengas.</div></div></header>`;
  h += `<div class="card"><label class="f" style="margin-top:0">➕ Añadir a la despensa</label>
    <input id="dq" type="search" placeholder="Busca en Mercadona: tortitas de arroz, sepia, kéfir…" autocomplete="off" value="${esc(despQuery)}">
    <div id="dres" class="stack" style="margin-top:8px"></div></div>`;
  h += `<h3 class="sec">Lista de la compra (${falta.length})</h3><div class="card list" style="padding:4px 0">`;
  h += falta.length ? falta.map(id => `<div class="li"><button class="check ${S.shop[id]?'on':''}" data-act="bought" data-id="${id}" aria-label="Comprado">${S.shop[id]?'✓':''}</button><div class="n">${esc(FOODS[id].n)}<div class="q num">${q(id)}</div>${brand(id)}</div></div>`).join('')
    : `<div class="empty">No falta nada. Cuando algo se acabe, márcalo abajo.</div>`;

/* ===================== Progreso ===================== */
function weekStart(k){ const d = keyToDate(k); const wd = (d.getDay()+6)%7; return addDays(k, -wd); }
function weeklyAvgs(){
  const by = {};
  Object.entries(S.weights).forEach(([k,v]) => { const w = weekStart(k); (by[w] = by[w] || []).push(v); });
  return Object.keys(by).sort().map(w => ({w, avg: by[w].reduce((a,b)=>a+b,0)/by[w].length, n: by[w].length}));
}
function renderProgreso(){
  const k = dayKey(), today = S.weights[k];
  const keys = Object.keys(S.weights).sort();
  const weeks = weeklyAvgs();
  let h = `<header class="top"><div><h1>Progreso</h1><div class="sub">Pésate al levantarte, después del baño.</div></div></header>
  <div class="card"><label class="f" style="margin-top:0">Peso de hoy (kg)</label><div class="row"><input type="number" inputmode="decimal" step="0.1" id="wt" value="${today ?? ''}" placeholder="75,0"><button class="btn pri sm" data-act="saveweight">Guardar</button></div></div>`;
  if (keys.length >= 2) h += `<div class="card">${chart(keys.slice(-42))}<div class="muted" style="font-size:12px">Puntos: peso diario · línea: media de 7 días</div></div>`;
  // regla del volumen
  const full = weeks.filter(w => w.w < weekStart(k) && w.n >= 3);
  let advice = 'Necesito al menos 3 semanas con 3 o más pesadas para recomendarte algo. Sigue así.';
  if (full.length >= 3){
    const [a,b,c] = full.slice(-3).map(w=>w.avg), d1 = b-a, d2 = c-b;
    if (d1 < 0.1 && d2 < 0.1) advice = `<b>Subes menos de 0,1 kg/semana</b> dos semanas seguidas: toca subir <b>150 kcal</b>.<div class="evactions"><button class="btn pri sm" data-act="kcaladj" data-v="150">Subir a ${(+S.settings.kcal)+150} kcal</button></div>`;
    else if (d2 > 0.35) advice = `<b>Subes más de 0,35 kg/semana</b>: demasiado rápido, parte será grasa.<div class="evactions"><button class="btn pri sm" data-act="kcaladj" data-v="-150">Bajar a ${(+S.settings.kcal)-150} kcal</button></div>`;
    else advice = `Ritmo correcto (${d2>=0?'+':''}${d2.toFixed(2).replace('.',',')} kg la última semana). <b>No toques nada.</b>`;
  } else if (full.length === 2){ const d = full[1].avg - full[0].avg; advice = `Última semana: <b>${d>=0?'+':''}${d.toFixed(2).replace('.',',')} kg</b>. Objetivo: +0,15 a +0,25 kg/semana. Con una semana más te digo si hay que ajustar.`; }
  h += `<ul class="tips"><li>${advice}</li></ul>`;
  if (weeks.length) h += `<h3 class="sec">Medias semanales</h3><div class="card" style="padding:6px 12px"><table class="t num"><tr><th>Semana</th><th>Media</th><th>Cambio</th><th>Días</th></tr>${weeks.slice(-8).reverse().map((w,i,arr)=>{ const prev = arr[i+1]; const d = prev ? w.avg - prev.avg : null; const dd = keyToDate(w.w);
    return `<tr><td>${dd.getDate()} ${MONTHS[dd.getMonth()]}</td><td>${w.avg.toFixed(1).replace('.',',')}</td><td>${d==null?'—':(d>=0?'+':'')+d.toFixed(2).replace('.',',')}</td><td>${w.n}</td></tr>`; }).join('')}</table></div>`;
  // cintura
  const wk = Object.keys(S.waist).sort();
  h += `<h3 class="sec">Cintura (cada 2 semanas)</h3><div class="card"><div class="row"><input type="number" inputmode="decimal" step="0.5" id="wa" placeholder="cm a la altura del ombligo"><button class="btn sm" data-act="savewaist">Guardar</button></div>
    ${wk.length ? `<table class="t num" style="margin-top:8px">${wk.slice(-6).reverse().map(x=>{const d=keyToDate(x);return `<tr><td>${d.getDate()} ${MONTHS[d.getMonth()]}</td><td>${String(S.waist[x]).replace('.',',')} cm</td></tr>`;}).join('')}</table>` : ''}</div>`;
  // adherencia
  h += `<h3 class="sec">Últimos 7 días</h3><div class="card">${adherence()}</div>`;
  h += `<h3 class="sec">Historial</h3><div class="card list" style="padding:4px 0">${historial()}</div>`;
  app.innerHTML = h;
}
// Días anteriores con algo registrado (los 30 últimos): lo comido frente al objetivo. Tocar uno lo abre en «Hoy».
function historial(){
  const hoy = dayKey(), TP = +S.settings.prot;
  const ks = Object.keys(S.days).filter(k => k < hoy && !dayIsEmpty(S.days[k])).sort().reverse().slice(0, 30);
  if (!ks.length) return `<div class="empty">Aún no hay días anteriores. Desde mañana verás aquí cada día; también puedes usar las flechas ‹ › en Hoy.</div>`;
  return ks.map(k => {
    const D = computeDay(k), d = keyToDate(k);
    const ord = D.sch.order.filter(m => !D.meals[m].merged), reg = ord.filter(m => D.meals[m].status !== 'pending').length;
    const ok = x => x ? 'color:var(--lime-ink)' : 'color:var(--amber)';
    const kOk = Math.abs(D.consumed.k + D.copas.k - D.TK) <= D.TK * 0.08, pOk = D.consumed.p >= TP * 0.9;
    return `<button class="li" data-act="openday" data-k="${k}" style="width:100%;text-align:left">
      <div class="n">${DAYS_LONG[d.getDay()][0].toUpperCase() + DAYS_LONG[d.getDay()].slice(1)} ${d.getDate()} ${MONTHS[d.getMonth()]}
        <div class="q num">${reg}/${ord.length} comidas registradas${S.days[k].nocuenta ? ' · no cuenta' : ''}${D.sch.tr.on ? ' · 🏋️' : ''}</div></div>
      <div class="num" style="text-align:right;font-size:14px"><span style="${ok(kOk)}">${R(D.consumed.k + D.copas.k)}</span>${D.copas.n ? ' 🍸' : ''} <span class="muted">kcal</span><br><span style="${ok(pOk)}">${R(D.consumed.p)}</span> <span class="muted">g P</span></div>
      <span class="muted" style="font-size:18px">›</span></button>`;
  }).join('');
}
function adherenceStats(){
  let meals = 0, ok = 0, protDays = 0, days = 0;
  for (let i = 1; i <= 7; i++){
    const k = addDays(dayKey(), -i); if (!S.days[k] || S.days[k].nocuenta) continue;
    const D = computeDay(k); days++;
    D.sch.order.forEach(m => { if (D.meals[m].merged) return; meals++; if (['done','changed','moved'].includes(D.meals[m].status)) ok++; });
    if (D.consumed.p >= D.target.p * 0.9) protDays++;
  }
  return {days, protDays, pct: meals ? R(ok/meals*100) : 0};
}
function adherence(){
  const {days, protDays, pct} = adherenceStats();
  if (!days) return `<div class="empty">Aún no hay días registrados.</div>`;
  return `<div class="hero"><div><div class="lbl">Comidas del plan</div><div class="big num">${pct}%</div><div class="small">Objetivo: 80 % o más</div></div>
    <div><div class="lbl">Días con proteína</div><div class="big num">${protDays}/${days}</div><div class="small">≥ 90 % del objetivo</div></div></div>
    ${(w => w.n ? `<div class="small" style="margin-top:10px">Media de calorías: <b class="num">${R(w.avg)} kcal/día</b> (objetivo ${kcalBase()}, ${w.avg - kcalBase() >= 0 ? '+' : '−'}${R(Math.abs(w.avg - kcalBase()))}) en ${w.n} día${w.n === 1 ? '' : 's'} con las 3 comidas principales registradas.</div>` : '')(weekKcal())}`;
}
function chart(keys){
  const W = 520, H = 150, P = 18;
  const vals = keys.map(k => S.weights[k]);
  const t0 = keyToDate(keys[0]).getTime(), t1 = keyToDate(keys[keys.length-1]).getTime() || t0+1;
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1){ lo -= .5; hi += .5; }
  const x = k => P + (keyToDate(k).getTime()-t0)/Math.max(1,(t1-t0))*(W-2*P), y = v => H-P - (v-lo)/(hi-lo)*(H-2*P);
  const ma = keys.map(k => { const ws = keys.filter(j => j <= k && j > addDays(k,-7)).map(j=>S.weights[j]); return [k, ws.reduce((a,b)=>a+b,0)/ws.length]; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    <text x="${P}" y="12" font-size="11" fill="var(--muted)">${hi.toFixed(1)}</text><text x="${P}" y="${H-4}" font-size="11" fill="var(--muted)">${lo.toFixed(1)}</text>
    <polyline fill="none" stroke="var(--lime)" stroke-width="3" stroke-linejoin="round" points="${ma.map(([k,v])=>x(k)+','+y(v)).join(' ')}"/>
    ${keys.map(k=>`<circle cx="${x(k)}" cy="${y(S.weights[k])}" r="3" fill="var(--muted)"/>`).join('')}</svg>`;
}

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushState(){ try{ return JSON.parse(localStorage.getItem(PUSH_KEY)) || null; }catch(_){ return null; } }
function setPushState(v){ try{ v ? localStorage.setItem(PUSH_KEY, JSON.stringify(v)) : localStorage.removeItem(PUSH_KEY); }catch(_){} }
function b64ToBytes(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); const raw = atob(s + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
function strHash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); }
const postJSON = (path, data) => fetch(PUSH_API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});

function pushCardHtml(){
  const av = S.settings.avisos, ps = pushState();
  let h = '';
  if (!pushSupported()) h = `<div class="muted" style="font-size:14px">Este navegador no admite avisos. Abre la app instalada desde Chrome.</div>`;
  else if (!ps || Notification.permission !== 'granted') h = `<button class="opt sel" data-act="pushon"><span>Activar avisos en este móvil</span><span class="d">pide permiso</span></button>`;
  else h = `<div class="row"><span style="flex:1">✅ Activados en este móvil</span><button class="btn sm" data-act="pushtest">Probar</button><button class="btn sm ghost" data-act="pushoff">Quitar</button></div>
    <div class="muted" style="font-size:12px;margin-top:6px">${ps.at ? 'Avisos sincronizados a las ' + new Date(ps.at).toTimeString().slice(0,5) : 'Sincronizando…'}</div>`;
  h += `<div class="list" style="margin-top:10px">${AVISOS.map(([k,n,d]) => `<div class="li" style="padding-left:0;padding-right:0"><button class="check ${av[k]?'on':''}" data-act="aviso" data-k="${k}" aria-label="${n}">${av[k]?'✓':''}</button><div class="n">${n}<div class="q">${d}</div></div></div>`).join('')}</div>`;
  return h;
}
async function pushOn(){
  if (!pushSupported()) throw new Error('navegador sin avisos');
  if (await Notification.requestPermission() !== 'granted') throw new Error('sin permiso');
  // al activar (o reactivar) se empieza siempre con una suscripción nueva: la anterior puede estar caducada
  setPushState({endpoint: await freshSub(true), hash:'', at:0});
  await syncSchedule(true);
}
async function pushOff(){
  const ps = pushState();
  try{ const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); if (ps) await postJSON('/unsubscribe', {endpoint:ps.endpoint}); }catch(_){}
  setPushState(null);
}
let syncTimer = null;
function queueSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(() => { syncSchedule(false); syncDias(); }, 2500); }
// Resumen diario para el entrenador, que lo cruza con Hevy: totales de los últimos 14 días, no cada alimento.
// Va con un token aleatorio de este móvil; solo se envía si algo ha cambiado.
let diasHash = '';
async function syncDias(){
  try{
    if (!S.syncToken){ S.syncToken = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join(''); save(); }
    const dias = [];
    for (let i = 13; i >= 0; i--){
      const k = addDays(dayKey(), -i), d = S.days[k], peso = S.weights[k] ?? null, cintura = (S.waist || {})[k] ?? null;
      if (dayIsEmpty(d) && peso == null && cintura == null) continue;
      const row = {dia:k, peso, cintura, nocuenta: !!(d && d.nocuenta)};
      if (!dayIsEmpty(d)){
        const D = computeDay(k), ord = D.sch.order.filter(m => !D.meals[m].merged);
        Object.assign(row, {kcal:D.consumed.k + D.copas.k, copas:D.copas.n, p:D.consumed.p, c:D.consumed.c, f:D.consumed.f, obj_kcal:D.TK, obj_p:+S.settings.prot || D.target.p,
          comidas: ord.filter(m => D.meals[m].status !== 'pending').length, comidas_total: ord.length, entreno: !!(D.sch.tr.on && D.sch.tr.done)});
      }
      dias.push(row);
    }
    const h = strHash(JSON.stringify(dias)); if (h === diasHash) return;
    const r = await postJSON('/dias', {token:S.syncToken, dias}); if (r.ok) diasHash = h;
  }catch(_){}
}
// La suscripción push puede morir (Google la da por caducada, p. ej. al reinstalar la app) o cambiar sin avisar.
// Se usa siempre la que tiene ahora el service worker; si no hay o el servidor la borró por caducada, se crea otra nueva.
async function freshSub(renew){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub && renew){ try{ await sub.unsubscribe(); }catch(_){} sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
  const r = await postJSON('/subscribe', {endpoint:sub.endpoint});
  if (!r.ok) throw new Error('el servidor respondió ' + r.status);
  return sub.endpoint;
}
async function syncSchedule(force, extra = []){
  const ps = pushState(); if (!ps) return false;
  const items = buildNotifications().concat(extra), h = strHash(JSON.stringify(items));
  try{
    const reg = await navigator.serviceWorker.ready, cur = await reg.pushManager.getSubscription();
    if (!cur || cur.endpoint !== ps.endpoint){ ps.endpoint = await freshSub(false); force = true; }
  }catch(_){}
  if (!force && h === ps.hash && Date.now() - ps.at < 6*3600e3) return true;
  try{
    let r = await postJSON('/schedule', {endpoint:ps.endpoint, items});
    // 404: el servidor la borró porque Google la rechazó → suscripción nueva
    if (r.status === 404){ ps.endpoint = await freshSub(true); r = await postJSON('/schedule', {endpoint:ps.endpoint, items}); }
    if (!r.ok) return false;
    setPushState(Object.assign(ps, {hash:h, at:Date.now()}));
    if (TAB === 'ajustes' && !document.querySelector('.sheet')) renderAjustes();
    return true;
  }catch(_){ return false; }
}
function epochAt(k, min){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d, 0, Math.round(min)).getTime(); }
const lowerName = id => { const n = dispName(id); return /^[A-ZÁÉÍÓÚ]{2,}/.test(n) ? n : n.toLowerCase(); };
function cookList(items){
  return items.filter(it => it.g > 0 && FOODS[it.id].g !== 'fruta' && FOODS[it.id].g !== 'liq')
    .map(it => FOODS[it.id].u ? amount(it.id, it.g) : `${amount(it.id, it.g)} de ${lowerName(it.id)}`).join(', ');
}
function weeklySummaryText(){
  const st = adherenceStats(), w = weeklyAvgs().filter(x => x.n >= 3), parts = [];
  if (st.days) parts.push(`Comidas del plan: ${st.pct} %. Días con tu proteína: ${st.protDays}/${st.days}.`);
  if (w.length){ const last = w[w.length-1], prev = w[w.length-2]; parts.push(`Peso medio: ${last.avg.toFixed(1).replace('.',',')} kg` + (prev ? ` (${last.avg-prev.avg>=0?'+':''}${(last.avg-prev.avg).toFixed(2).replace('.',',')} kg)` : '') + '.'); }
  else parts.push('Esta semana apenas hay pesadas: pésate por las mañanas.');
  parts.push('Toca para ver los detalles.');
  return parts.join(' ');
}
function buildNotifications(){
  const av = S.settings.avisos, out = [], now = Date.now(), today = dayKey();
  const lastWaist = Object.keys(S.waist).sort().pop();
  const waistDue = lastWaist ? addDays(lastWaist, 14) : today;
  let waistDone = false;
  for (let d = 0; d < 8; d++){
    const k = addDays(today, d), existed = !!S.days[k];
    const D = computeDay(k), day = S.days[k];
    if (!existed) delete S.days[k]; // no guardar días futuros vacíos
    const wake = D.sch.wake, wd = keyToDate(k).getDay();
    let breakfastMerged = false;
    if (av.buenosdias && !(existed && day.wake) && S.weights[k] == null){
      const des = D.meals.desayuno;
      let body = '¿Peso de hoy? Pésate antes de desayunar, después del baño.';
      if (av.comidas && des.status === 'pending' && Math.abs(des.t - 30 - (wake + 5)) <= 20){
        body += ` Y ve preparando el desayuno (${fmt(des.t)}): ${cookList(des.items)}.`; breakfastMerged = true;
      }
      out.push({nid:`${k}:buenosdias`, at:epochAt(k, wake + 5), title:'☀️ Buenos días', body, tag:'buenosdias', url:'#progreso'});
    }
    if (av.comidas) for (const m of D.sch.order){
      const M = D.meals[m];
      if (M.status !== 'pending' || M.merged || (m === 'desayuno' && breakfastMerged)) continue;
      if (m === 'merienda') out.push({nid:`${k}:comida:${m}:${M.t}`, at:epochAt(k, M.t), title:'🥤 Hora del batido', body:M.items.map(it => `${amount(it.id, it.g)} de ${dispName(it.id).toLowerCase()}`).join(', ') + '.', tag:'comida', url:'#hoy'});
      else out.push({nid:`${k}:comida:${m}:${M.t}`, at:epochAt(k, M.t - 30), title:`🍳 ${MEAL_NAME[m]} a las ${fmt(M.t)}`,
        body:`Iría bien ir empezando a cocinar: ${cookList(M.items)}.${M.notes.length ? ' Lleva ajustes por lo de hoy.' : ''}`, tag:'comida', url:'#hoy'});
    }
    if (av.resumen && wd === 0) out.push({nid:`${k}:resumen`, at:epochAt(k, 11*60), title:'📊 Tu semana', body:weeklySummaryText(), tag:'resumen', url:'#progreso'});
    const falta = Object.keys(S.pantry).filter(id => S.pantry[id] === 'falta' && FOODS[id]);
    if (av.compra && wd === 6 && falta.length) out.push({nid:`${k}:compra`, at:epochAt(k, 10*60), title:'🛒 Toca hacer la compra',
      body:`Te falta${falta.length===1?'':'n'} ${falta.length} cosa${falta.length===1?'':'s'}: ${falta.slice(0,5).map(id => FOODS[id].n.toLowerCase()).join(', ')}${falta.length>5?'…':''}.`, tag:'compra', url:'#compra'});
    if (av.cintura && !waistDone && k >= waistDue && epochAt(k, wake + 15) > now + 60e3){ waistDone = true;
      out.push({nid:`${k}:cintura`, at:epochAt(k, wake + 15), title:'📏 Toca medir la cintura', body:'A la altura del ombligo, relajado y al final de soltar el aire. Apúntalo en Progreso.', tag:'cintura', url:'#progreso'}); }
  }
  return out.filter(n => n.at > now + 30e3).sort((a,b) => a.at - b.at);
}

/* ===================== Eventos globales ===================== */
document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; TAB = b.dataset.tab; if (TAB === 'hoy') VIEW = null; history.replaceState(null, '', '#' + TAB); window.scrollTo(0,0); render(); });
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, m = b.dataset.m;
  if (a === 'done') logMeal(m, 'done');
  else if (a === 'more') sheetMore(m);
  else if (a === 'undo' && getDay(viewDay()).meals[m]?.status === 'moved') undoMove(m);
  else if (a === 'undo'){ const day = getDay(viewDay()); const prev = day.meals[m]; delete day.meals[m]; if (m === 'cena' && day.meals.merienda && !day.meals.merienda.items?.length) delete day.meals.merienda; save(); render(); toast(MEAL_NAME[m] + ' vuelve a pendiente', () => { day.meals[m] = prev; save(); render(); }); }
  else if (a === 'swap') sheetSwap(m, +b.dataset.i);
  else if (a === 'qty') changeQty(m, +b.dataset.i, +b.dataset.d);
  else if (a === 'qtyset') sheetQty(m, +b.dataset.i);
  else if (a === 'coach') sheetCoach(m);
  else if (a === 'foto') fotoMeal(m);
  else if (a === 'dayprev'){ VIEW = addDays(viewDay(), -1); window.scrollTo(0,0); render(); }
  else if (a === 'daynext'){ const n = addDays(viewDay(), 1); VIEW = n >= dayKey() ? null : n; window.scrollTo(0,0); render(); }
  else if (a === 'daytoday'){ VIEW = null; window.scrollTo(0,0); render(); }
  else if (a === 'openday'){ VIEW = b.dataset.k; TAB = 'hoy'; history.replaceState(null, '', '#hoy'); window.scrollTo(0,0); render(); }
  else if (a === 'planreset'){ const day = getDay(viewDay()); if (day.planEdit) delete day.planEdit[m]; save(); render(); toast(MEAL_NAME[m] + ': vuelve al plan'); }
  else if (a === 'wake') sheetWake();
  else if (a === 'train') sheetTrain();
  else if (a === 'fiesta') sheetFiesta();
  else if (a === 'nocuenta'){ const day = getDay(viewDay()); day.nocuenta = !day.nocuenta; save(); render(); toast(day.nocuenta ? 'Este día no cuenta para tus estadísticas' : 'Este día vuelve a contar'); }
  else if (a === 'pantry'){ const id = b.dataset.id; if (S.pantry[id] === 'falta'){ delete S.pantry[id]; delete S.shop[id]; } else S.pantry[id] = 'falta'; save(); render(); }
  else if (a === 'bought'){ const id = b.dataset.id; S.shop[id] = !S.shop[id]; save(); render(); }
  else if (a === 'restock'){ Object.keys(S.shop).forEach(id => { if (S.shop[id]){ delete S.pantry[id]; delete S.shop[id]; } }); save(); render(); toast('Despensa actualizada'); }
  else if (a === 'copylist'){ const need = weeklyNeeds(); const txt = 'Lista de la compra (Mercadona)\n' + Object.keys(S.pantry).filter(id=>S.pantry[id]==='falta' && FOODS[id]).map(id => '- ' + (FOODS[id].brand || FOODS[id].n) + (need[id] ? ' (' + amount(id, need[id]) + ')' : '')).join('\n'); try{ await navigator.clipboard.writeText(txt); toast('Lista copiada'); }catch(_){ toast('No se pudo copiar'); } }
  else if (a === 'link') sheetLink(b.dataset.id);
  else if (a === 'desp-add'){ const id = b.dataset.id; useMDB(id); persistFood(id); S.despensa = S.despensa || {}; S.despensa[id] = Date.now(); delete S.pantry[id]; save(); render(); toast(FOODS[id].n + ' en la despensa'); }
  else if (a === 'desp-del'){ const id = b.dataset.id, prev = [S.despensa[id], S.pantry[id], S.shop[id]]; delete (S.despensa || {})[id]; delete S.pantry[id]; delete S.shop[id]; save(); render();
    toast(FOODS[id].n + ' quitado de la despensa', () => { S.despensa[id] = prev[0]; if (prev[1]) S.pantry[id] = prev[1]; if (prev[2]) S.shop[id] = prev[2]; save(); render(); }); }
  else if (a === 'desp-quitar'){ const id = b.dataset.id, prev = S.pantry[id]; S.pantry[id] = 'fuera'; delete S.shop[id]; save(); render();
    toast(FOODS[id].n + ' quitado: el plan lo cambia por otra cosa', () => { if (prev) S.pantry[id] = prev; else delete S.pantry[id]; save(); render(); }); }
  else if (a === 'desp-volver'){ delete S.pantry[b.dataset.id]; save(); render(); }
  else if (a === 'saveweight'){ const v = parseFloat(String(document.getElementById('wt').value).replace(',','.')); if (v > 30 && v < 250){ S.weights[dayKey()] = Math.round(v*10)/10; save(); render(); toast('Peso guardado'); } else toast('Peso no válido'); }
  else if (a === 'savewaist'){ const v = parseFloat(String(document.getElementById('wa').value).replace(',','.')); if (v > 40 && v < 200){ S.waist[dayKey()] = v; save(); render(); toast('Cintura guardada'); } }
  else if (a === 'tday'){ const d = +b.dataset.d, s = S.settings; s.trainDays = s.trainDays.includes(d) ? s.trainDays.filter(x=>x!==d) : s.trainDays.concat(d); save(); render(); }
  else if (a === 'theme'){ S.settings.theme = b.dataset.v; save(); render(); }
  else if (a === 'savekey'){ const v = document.getElementById('aikey').value.trim(); if (!v || v.startsWith('•')) return toast('Pega tu API key'); if (!v.startsWith('sk-ant-')) return toast('Eso no parece una key de Anthropic'); try{ localStorage.setItem(AI_KEY, v); }catch(_){} render(); toast('Key guardada en este móvil'); }
  else if (a === 'delkey'){ try{ localStorage.removeItem(AI_KEY); }catch(_){} render(); toast('Key borrada'); }
  else if (a === 'kcaladj'){ S.settings.kcal = (+S.settings.kcal || 2500) + (+b.dataset.v); save(); render(); toast(`Objetivo: ${S.settings.kcal} kcal. El plan se ha recalculado.`); }
  else if (a === 'pushon'){ b.disabled = true; try{ await pushOn(); toast('Avisos activados en este móvil'); }catch(err){ toast('No se pudieron activar: ' + (err.message || err)); } render(); }
  else if (a === 'pushoff'){ await pushOff(); render(); toast('Avisos desactivados'); }
  else if (a === 'pushtest'){ const ok = await syncSchedule(true, [{nid:'prueba-' + Date.now(), at:Date.now() + 60e3, title:'🔔 Aviso de prueba', body:'Así te llegarán los avisos, aunque la app esté cerrada. Ciérrala y espera 1–2 minutos.', tag:'prueba', url:'#ajustes'}]); toast(ok ? 'Llegará en 1–2 minutos. Puedes cerrar la app.' : 'No se pudo contactar con el servidor'); }
  else if (a === 'aviso'){ const key = b.dataset.k; S.settings.avisos[key] = !S.settings.avisos[key]; save(); render(); }
  else if (a === 'export'){ const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const url = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = url; l.download = 'dieta-' + dayKey() + '.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(url), 2000); }
});
app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(() => { if (!document.hidden && TAB === 'hoy' && !document.querySelector('.sheet')) render(); }, 60000);

// los avisos abren la app en la pestaña que toca (#hoy, #progreso, #compra…)
function tabFromHash(){ const h = location.hash.slice(1); if (['hoy','compra','progreso','ajustes'].includes(h)) TAB = h; }
window.addEventListener('hashchange', () => { tabFromHash(); render(); });
tabFromHash();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
// Si la dieta base aún no está vinculada a Mercadona, la base se carga en segundo plano y se vincula sola
if (Object.keys(S.link || {}).length < Object.keys(FOODS_BASE).length - 3) setTimeout(() => loadMDB().then(() => render()).catch(() => {}), 1200);
render();
</script>
