<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Dieta</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#101310; --card:#191d19; --card2:#20251f; --line:#2b322a; --text:#eef2ea; --muted:#98a294;
  --lime:#b8f040; --lime-ink:#b8f040; --on-lime:#142000; --amber:#f2b33d; --coral:#ff6f5e; --sky:#7cc4ff;
  --radius:18px; --shadow:0 8px 30px rgba(0,0,0,.35); --toast-link:#3f6d00;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5ef; --card:#ffffff; --card2:#eef0e8; --line:#dfe3d7; --text:#151a14; --muted:#636d60;
    --lime:#b8f040; --lime-ink:#4b7d00; --on-lime:#142000; --amber:#b87800; --coral:#d8432f; --sky:#1f78c4;
    --shadow:0 6px 24px rgba(30,40,20,.10); --toast-link:#b8f040; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f5ef; --card:#ffffff; --card2:#eef0e8; --line:#dfe3d7; --text:#151a14; --muted:#636d60;
  --lime:#b8f040; --lime-ink:#4b7d00; --on-lime:#142000; --amber:#b87800; --coral:#d8432f; --sky:#1f78c4;
  --shadow:0 6px 24px rgba(30,40,20,.10); --toast-link:#b8f040; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime);outline-offset:1px}
button:disabled{opacity:.6}
.num{font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:16px 16px 24px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 14px}
header.top h1{font-size:22px;margin:0;letter-spacing:-.02em}
.daynav{display:flex;align-items:center;gap:8px}
.navb{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:800;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.navb:disabled{opacity:.3}
header.top .sub{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--lime);color:var(--on-lime);border-color:transparent}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero .big{font-size:clamp(28px,9vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.hero .big span{font-size:clamp(14px,4.2vw,20px)!important}
.hero .lbl{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.hero .small{color:var(--muted);font-size:13px;margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.bar.k>i{background:var(--sky)}
.macros{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-top:12px;grid-column:1/-1}
.tips{margin:0 0 12px;padding:0;list-style:none}
.tips li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.tips li.amber{border-left-color:var(--amber)}
.tips li.coral{border-left-color:var(--coral)}
.timeline{position:relative}
.ev{position:relative;touch-action:pan-y;user-select:none}
.ev .card{position:relative;z-index:1;transition:transform .15s ease;margin-bottom:10px}
.ev.drag .card{transition:none}
.ev .swipebg{position:absolute;inset:0 0 10px 0;border-radius:var(--radius);background:var(--lime);color:var(--on-lime);display:flex;align-items:center;padding-left:20px;font-weight:800;opacity:0}
.evhead{display:flex;align-items:center;gap:10px}
.evtime{font-size:22px;font-weight:800;letter-spacing:-.02em;min-width:66px}
.evname{font-weight:700;font-size:17px;flex:1}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--lime);color:var(--on-lime)}
.badge.late{background:transparent;border:1px solid var(--amber);color:var(--amber)}
.badge.skip{background:transparent;border:1px solid var(--coral);color:var(--coral)}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.items li:first-child{border-top:0}
.items li button{text-align:left;flex:1;padding:0}
.items .amt{color:var(--muted);white-space:nowrap}
.items li.plus .amt,.items li.plus button{color:var(--lime-ink)}
.items li.minus .amt{color:var(--amber)}
.items li.miss button{color:var(--coral)}
.items s{opacity:.55}
.items .qty{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.items .stp{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-weight:800;line-height:1;display:grid;place-items:center;color:var(--text);padding:0}
.items .stp:active{background:var(--lime);color:var(--on-lime)}
.items .qamt{padding:4px 2px;text-decoration:underline dotted;text-underline-offset:3px}
.items li.mv{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.items li.mv.hold{background:var(--card2);border-radius:8px}
.stp-reset{color:var(--lime-ink);font-weight:700;font-size:13px;padding:0;margin-left:4px;text-decoration:underline}
.evnote{font-size:13px;color:var(--muted);margin-top:8px}
.evnote b{color:var(--text)}
.evactions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;text-align:center}
.btn.pri{background:var(--lime);color:var(--on-lime);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--coral);border-color:var(--coral);background:transparent}
.btn.sm{flex:0 0 auto;padding:9px 12px;font-size:14px}
.ev.trainev .card{border-style:dashed}
.ev.dim .card{opacity:.62}
.ev.sleep .card{background:transparent}
.macroline{font-size:12px;color:var(--muted);margin-top:6px}
.mm{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mm span{font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.mm b{color:var(--text);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--text);background:var(--card)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .18s ease}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.opt .d{color:var(--muted);font-size:13px}
.opt.sel{border-color:var(--lime)}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--on-lime)}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.days button.on{background:var(--lime);color:var(--on-lime);border-color:transparent}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 2px 8px}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.list .li .n{flex:1}
.list .li .q{color:var(--muted);font-size:13px}
.tog{padding:6px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card2)}
.tog.falta{border-color:var(--coral);color:var(--coral);background:transparent}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.check.on{background:var(--lime);border-color:transparent;color:var(--on-lime)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
table.t td:first-child,table.t th:first-child{text-align:left}
.chart{width:100%;height:150px;display:block}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:20;box-shadow:var(--shadow);animation:up .2s}
.toast button{color:var(--toast-link);font-weight:800;margin-left:10px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

const FOODS_BASE = JSON.parse(JSON.stringify(FOODS)); // valores genéricos, para poder desvincular
const GROUP_KEY = {prot:'p',carb:'c',grasa:'f',fruta:'c',verd:null,liq:null};
const ALTS = {
  prot:['pollo','pavo','atun','merluza','ternera','salmon','sardinas','claras','huevo','quesob','yogurp','whey'],
  carb:['arroz','pasta','patata','pan','avena','batata','garbanzos'],
  fruta:['platano','naranja','manzana'],

/* ===================== Plan semanal (de 01_Dieta.md) ===================== */
const DESAYUNO = [['huevo',220],['pan',100],['platano',120],['nueces',15]];
const BATIDO = [['whey',30],['leche',250],['avena',40]];
// desde este día el batido va todos los días (antes, solo los de entreno; el historial anterior no cambia)
const BATIDO_DIARIO = '2026-10-28';
const ALM = {
  pollo_arroz:[['pollo',200],['arroz',100],['brocoli',200],['zanahoria',100],['aove',10],['naranja',150]],

// Copas de fiesta: valores genéricos por unidad (el alcohol da 7 kcal/g y no cuenta como hidratos ni grasa)
const COPAS = {
  cubata:   {n:'Cubata con refresco normal', d:'50 ml de destilado + refresco', k:190, c:22},
  cubata0:  {n:'Cubata con refresco zero',   d:'ron-cola zero, gin-tónica light…', k:110, c:0},

  vino:     {n:'Copa de vino',               d:'150 ml', k:120, c:4},
  chupito:  {n:'Chupito',                    d:'40 ml', k:95, c:4},
};
function copasOf(day){
  const f = day && day.fiesta; if (!f) return {n:0, k:0, p:0, c:0, f:0};
  let n = 0, k = 0, c = 0;
  for (const [t, q] of Object.entries(f.copas || {})) if (COPAS[t] && q > 0){ n += q; k += q * COPAS[t].k; c += q * COPAS[t].c; }
  return {n, k, p:0, c, f:0};
}
const OTHER_PRESETS = {
  ligero:{label:'Algo ligero',k:600,p:30,c:65,f:20},

  settings:{kcal:2500,prot:160,wake:'09:00',bed:'00:45',trainTime:'12:00',trainDur:75,trainDays:[1,2,4,5],gap:150,dinnerLimit:'22:30',lateDinner:'23:00',theme:'auto',aiModel:'claude-opus-5-5',
    avisos:{comidas:true,buenosdias:true,resumen:true,compra:true,cintura:true}},
  days:{}, weights:{}, waist:{}, pantry:{}, shop:{}, ai:{spent:{}, calls:{}},
};
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ S = {}; }
  S = Object.assign(structuredClone(DEFAULTS), S);
  S.settings = Object.assign(structuredClone(DEFAULTS.settings), S.settings);

// Cada alimento base de la despensa puede ir vinculado a su producto de Mercadona (S.link): entonces el plan
// usa los macros de su etiqueta, salvo que no sean comparables (otro estado, conserva sin escurrir, mezcla…).
const LINK_SOLO_NOMBRE = new Set(['ensalada', 'agua', 'whey']);
const ESTADO_BASE = {arroz:'c', pasta:'c', avena:'c'};
function linkUsaMacros(base, mid){
  const B = FOODS_BASE[base], F = FOODS[mid];
  if (!B || !F || LINK_SOLO_NOMBRE.has(base) || F.tal || F.q === 'b') return false;
  if (ESTADO_BASE[base] && F.s && F.s !== ESTADO_BASE[base]) return false;
  return Math.abs(F.k - B.k) / Math.max(B.k, 1) <= 0.4; // red de seguridad ante vínculos raros
}
// Nombre que se muestra: el producto de Mercadona vinculado si lo hay (la ensalada, que son tres productos, no)
function dispName(id){
  const F = FOODS[id]; if (!F) return id;
  return FOODS_BASE[id] && F.brand && !LINK_SOLO_NOMBRE.has(id) ? F.brand : F.n;
}
function applyLinks(){
  for (const base of Object.keys(FOODS_BASE)){
    const B = FOODS_BASE[base], F = FOODS[base], mid = (S.link || {})[base];
    Object.assign(F, {k:B.k, p:B.p, c:B.c, f:B.f}); delete F.brand; delete F.brandMacros;
    if (!mid || !FOODS[mid]) continue;
    F.brand = FOODS[mid].n;
    if (linkUsaMacros(base, mid)){ const M = FOODS[mid]; Object.assign(F, {k:M.k, p:M.p, c:M.c, f:M.f}); F.brandMacros = true; }
  }
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ===================== Utilidades ===================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin = hhmm => { const [h,m] = hhmm.split(':').map(Number); return h*60+m; };
const fmt = min => { min = Math.round(min); const d = ((min % 1440)+1440)%1440; return String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0'); };
const R = n => Math.round(n);
function nowMin(){ const d = new Date(); let m = d.getHours()*60+d.getMinutes(); if (d.getHours() < 5) m += 1440; return m; }
function dayKey(d = new Date()){ const x = new Date(d.getTime() - 5*3600e3); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
// Día que se está viendo en «Hoy» (null = hoy). Las acciones de comidas se aplican a ese día.
let VIEW = null;
function viewDay(){ if (VIEW && VIEW >= dayKey()) VIEW = null; return VIEW || dayKey(); }
// «ahora» para un día: la hora real si es hoy; si es un día pasado, el final de ese día (las 5:00 siguientes)
function nowFor(k){ return k === dayKey() ? nowMin() : 29 * 60; }
function keyToDate(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d, 12); }
function addDays(k, n){ const d = keyToDate(k); d.setDate(d.getDate()+n); return dayKey(new Date(d.getTime()+5*3600e3)); }
function bedMin(){ let b = toMin(S.settings.bed); if (b < 5*60) b += 1440; return b; }
function getDay(k){ return S.days[k] || (S.days[k] = {meals:{}}); }
function mac(id, g){ const F = FOODS[id], r = g/100; return {k:F.k*r,p:F.p*r,c:F.c*r,f:F.f*r}; }
function sumItems(items){ return items.reduce((a,it)=>{ const m = mac(it.id,it.g); a.k+=m.k; a.p+=m.p; a.c+=m.c; a.f+=m.f; return a; }, {k:0,p:0,c:0,f:0}); }
const addM = (a,b,s=1) => ({k:a.k+s*b.k,p:a.p+s*b.p,c:a.c+s*b.c,f:a.f+s*b.f});
const ZERO = {k:0,p:0,c:0,f:0};
function roundG(id, g){ const F = FOODS[id]; if (g <= 0) return 0; if (F.u) return Math.max(1, Math.round(g/F.u))*F.u; return g >= 100 ? Math.round(g/10)*10 : Math.max(5, Math.round(g/5)*5); }
function amount(id, g){ const F = FOODS[id]; if (F.u){ const n = Math.round(g/F.u); return n+' '+F.un[n===1?0:1]; } return R(g)+(F.ml?' ml':' g'); }
function equiv(from, g, to){
  const key = GROUP_KEY[FOODS[from].g];
  if (!key || FOODS[to][key] <= 0 || FOODS[from][key] <= 0) return roundG(to, g);
  return roundG(to, FOODS[from][key]*g/FOODS[to][key]);
}
/* ===================== Base de alimentos de Mercadona ===================== */
// alimentos.json se descarga la primera vez que hace falta (buscador, intercambios, escáner, IA) y el service
// worker la deja guardada. Los productos que llegas a usar se copian a S.foods: así la app los tiene siempre,
// aunque la base no esté cargada, y la pantalla Hoy nunca la necesita.
const DB_GROUP = {prot:'prot', carb:'carb', grasa:'grasa', fruta:'fruta', verd:'verd', lacteo:'lacteo', bebida:'liq', snack:'snack', plato:'plato', salsa:'salsa', otro:'otro'};
Object.assign(GROUP_KEY, {lacteo:'p', snack:'k', plato:'k', salsa:null, otro:'k'});
Object.assign(GROUP_NAME, {lacteo:'Lácteo', snack:'Capricho', plato:'Plato', salsa:'Salsa', otro:'Otro'});
const MDB_FECHA = '19/10/2026';
let MDB = null, mdbLoading = null;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const STOP = new Set('de del la el los las un una unos unas y con sin al a en por para que me mi he ha hemos comido comi tomado tomo cena comida almuerzo desayuno plato poco mitad gramos media medio trozo racion menu dia hoy algo poquito'.split(' '));
function mdbFood(r){ // fila compacta de alimentos.json -> forma de FOODS
  const F = {n:r.n, g: r.l && r.g === 'lacteo' ? 'liq' : (DB_GROUP[r.g] || 'otro'), k:r.k, p:r.p, c:r.h, f:r.f, sec:'Mercadona · ' + r.c, mid:true, q:r.q};
  if (r.u) Object.assign(F, {u:r.u, un:['ud.', 'uds.']});
  if (r.l) F.ml = 1;
  if (r.e) F.ean = r.e;
  if (r.x) F.tal = 1; // conserva en aceite: valores sin escurrir
  if (r.s) F.s = r.s;
  return F;
}
function persistFood(id){ const F = FOODS[id]; if (F && F.mid){ S.foods = S.foods || {}; S.foods[id] = F; } }
// La primera vez que se carga la base, cada alimento base se vincula con su producto de Mercadona más fiable.
function autoLink(){
  if (!MDB || !MDB.map) return;
  S.link = S.link || {};
  let changed = false;
  for (const [base, ids] of Object.entries(MDB.map)){
    if (base in S.link || !FOODS_BASE[base]) continue;
    // el más típico (orden de la base) que se parezca en kcal al del plan (±20 %); si ninguno, el más parecido.
    // Así el salmón fresco no acaba vinculado al salmón en lata.
    const B = FOODS_BASE[base], dif = id => Math.abs(FOODS[id].k - B.k) / Math.max(B.k, 1);
    const fiables = ids.filter(id => useMDB(id) && FOODS[id].q !== 'b');
    const id = fiables.find(i => dif(i) <= 0.2) || fiables.slice().sort((a, b) => dif(a) - dif(b))[0] || ids.find(i => useMDB(i)); if (!id) continue;
    S.link[base] = id; persistFood(id); changed = true;
  }
  if (changed){ applyLinks(); save(); }
}
async function loadMDB(){
  if (MDB) return MDB;
  if (!mdbLoading) mdbLoading = fetch('alimentos.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      const list = d.a.map(r => ({id:r.i, r, t:' ' + norm(r.n + ' ' + r.c).replace(/[^a-z0-9ñ]+/g, ' ')}));
      const byEan = {}, byId = {};
      list.forEach(x => { byId[x.id] = x; if (x.r.e) byEan[x.r.e] = x; });
      MDB = {fecha:d.fecha, list, byEan, byId, n:list.length, map:d.map || {}};
      autoLink();
      return MDB;
    })
    .catch(e => { mdbLoading = null; throw e; });
  return mdbLoading;
}
function useMDB(id){ if (!FOODS[id] && MDB && MDB.byId[id]) FOODS[id] = mdbFood(MDB.byId[id].r); return FOODS[id]; }
function keepFood(id){ // un producto que se usa: se guarda y sube en «recientes»
  const F = FOODS[id]; if (!F) return;
  if (F.mid){ S.foods = S.foods || {}; S.foods[id] = F; }
  S.recent = S.recent || {}; S.recent[id] = Date.now();
}
// Búsqueda local: palabras de la consulta como prefijo de las palabras del producto.
// Sin consulta, ordena por recientes y confianza (útil para los intercambios).
function searchFoods(q, {group = null, limit = 20, base = true, mercadona = true} = {}){
  const words = norm(q || '').split(/[^a-z0-9ñ]+/).filter(w => w.length > 1 && !STOP.has(w)).map(w => w.length > 4 && w.endsWith('s') ? w.slice(0, -1) : w);
  const rec = S.recent || {}, qual = {a:2, m:1, b:0}, out = [];
  // +1 por palabra encontrada; +0,3 si el nombre empieza por la primera palabra («sepia limpia» antes que «tinta de sepia»)
  const score = t => { const s = words.reduce((a, w) => a + (t.includes(' ' + w) ? 1 : 0), 0); return s && t.startsWith(' ' + words[0]) ? s + 0.3 : s; };
  if (base) for (const [id, F] of Object.entries(FOODS)){
    if (F.mid || !(F.sec || id === 'agua') || (group && F.g !== group)) continue;
    const s = words.length ? score(' ' + norm(F.n).replace(/[^a-z0-9ñ]+/g, ' ')) : 0;
    if (words.length && !s) continue;
    out.push({id, s: s + 0.5, r: rec[id] || 0, q: 2, l: F.n.length});
  }
  if (mercadona && MDB) for (const x of MDB.list){
    const g = x.r.l && x.r.g === 'lacteo' ? 'liq' : (DB_GROUP[x.r.g] || 'otro');
    if (group && g !== group) continue;
    const s = words.length ? score(x.t) : 0;
    if (words.length && !s) continue;
    out.push({id:x.id, s, r: rec[x.id] || 0, q: qual[x.r.q] ?? 0, l: x.r.n.length});
  }
  // más coincidencias > usado hace poco > dato más fiable > nombre más corto (más genérico)
  out.sort((a, b) => b.s - a.s || b.r - a.r || b.q - a.q || a.l - b.l);
  return out.slice(0, limit).map(o => o.id);
}
// Para la IA: cada parte de la descripción («…, … y … con …») aporta sus propios candidatos.
function candidatesFor(text, limit = 20){
  const parts = norm(text).split(/[,;:.\n+]| y | con | mas | ademas | luego /).map(s => s.trim()).filter(Boolean);
  const out = [];
  for (const p of parts) for (const id of searchFoods(p, {limit:6, base:false})) if (!out.includes(id)) out.push(id);
  return out.slice(0, limit);
}

function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = esc(msg) + (undo ? ' <button>Deshacer</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  document.body.appendChild(t); setTimeout(()=>t.remove(), 4000);
}

/* ===================== Entreno y horario ===================== */
function trainOf(k){
  const day = getDay(k), wd = keyToDate(k).getDay();
  const t = day.train || {};
  const on = t.on !== undefined ? t.on : S.settings.trainDays.includes(wd);
  const start = toMin(t.time || S.settings.trainTime);
  return {on, start, dur: t.dur || S.settings.trainDur, done: !!t.done, custom: t.on !== undefined || !!t.time};
}
function wakeOf(k){ const d = getDay(k); return toMin(d.wake || S.settings.wake); }

function desiredTimes(wake, tr){
  const bk = wake + 30, dinnerBase = wake + 720;
  if (!tr.on) return {desayuno:bk, almuerzo:bk+270, merienda:bk+465, cena:Math.max(dinnerBase, bk+630)};
  const tS = tr.start, tE = tS + tr.dur;
  if (tS < bk + 60){ // entreno nada más levantarse
    const d = Math.max(bk, tE + 20), a = d + 240, m = a + 180;
    return {desayuno:d, almuerzo:a, merienda:m, cena:Math.max(dinnerBase, m + 150)};
  }
  if (tS < 16*60){ const a = Math.max(bk + 150, tE + 30), m = a + 195; return {desayuno:bk, almuerzo:a, merienda:m, cena:Math.max(dinnerBase, m + 165)}; }
  if (tS < 19*60){ const a = bk + 270, m = tE + 15; return {desayuno:bk, almuerzo:a, merienda:m, cena:Math.max(dinnerBase, m + 150)}; }
  const a = bk + 270; return {desayuno:bk, almuerzo:a, merienda:a + 180, cena:tE + 30};
}

function schedule(k){
  const day = getDay(k), tr = trainOf(k), wake = wakeOf(k), want = desiredTimes(wake, tr);
  const order = ['desayuno','almuerzo'].concat(tr.on || k >= BATIDO_DIARIO ? ['merienda'] : [], ['cena']);
  // cada comida pendiente va, como pronto, «hueco mínimo» después de la anterior (hecha o prevista)
  // si una comida se registra ANTES de su hora prevista, lo que queda se adelanta lo mismo (adv < 0);
  // si se registra tarde, ya lo empuja el hueco mínimo
  const out = {}, prevOf = {}; let prev = null, adv = 0;
  for (const m of order){
    const log = day.meals[m];
    prevOf[m] = prev;
    if (log && log.status !== 'pending'){
      const t = log.at != null ? log.at : want[m];
      out[m] = {t, status:log.status};
      if (log.status !== 'skipped' && log.status !== 'moved'){ prev = t; adv = Math.min(0, t - want[m]); }
    } else {
      const t = prev != null ? Math.max(want[m] + adv, prev + S.settings.gap) : want[m];
      out[m] = {t, status:'pending'}; prev = t;
    }
  }
  // si no cabe todo antes del límite, el batido se toma con la cena
  const limit = toMin(S.settings.dinnerLimit);
  if (out.merienda && out.merienda.status === 'pending' && out.cena.status === 'pending' && out.cena.t > limit){
    out.merienda.merged = true;
    const p = prevOf.merienda;
    out.cena.t = p != null ? Math.max(want.cena + adv, p + S.settings.gap) : want.cena;
  }
  return {order, times:out, tr, wake, want};
}

/* ===================== Plan del día y motor de ajuste ===================== */
function mkItems(arr){ return arr.map(([id,g]) => ({id, g})); }
// Escala el plan del día al objetivo: primero la proteína, luego hidratos y grasa.
// Fruta y verdura no se tocan. El batido entra dentro del total.
function fitToTarget(plan, kT = kcalBase()){
  const all = Object.values(plan).flat();
  const pT = +S.settings.prot || 160;
  const prot = all.filter(it => FOODS[it.id].g === 'prot');
  const pProt = prot.reduce((a,it) => a + mac(it.id, it.g).p, 0), pOther = sumItems(all).p - pProt;
  if (pProt > 0){ const sp = Math.max(0.6, Math.min(1.5, (pT - pOther) / pProt)); prot.forEach(it => it.g = roundG(it.id, it.g * sp)); }
  const cf = all.filter(it => FOODS[it.id].g === 'carb' || FOODS[it.id].g === 'grasa');
  const kCF = cf.reduce((a,it) => a + mac(it.id, it.g).k, 0), k1 = sumItems(all).k;
  if (kCF > 0){ const s = Math.max(0.35, Math.min(1.8, 1 + (kT - k1) / kCF)); cf.forEach(it => it.g = roundG(it.id, it.g * s)); }
  // Ajuste fino: el redondeo (huevos enteros, gramos de 5 en 5…) deja el día unos gramos fuera del objetivo.
  // Se corrige con el alimento más grande que se pueda pesar libremente: proteína con carne/pescado, kcal con
  // patata/arroz/pasta. Dos pasadas, porque tocar uno mueve un poco el otro.
  const libre = grp => all.filter(it => FOODS[it.id].g === grp && !FOODS[it.id].u && it.g >= 40 && FOODS[it.id][grp === 'prot' ? 'p' : 'k'] > 0)
    .sort((a, b) => b.g - a.g)[0];
  for (let pass = 0; pass < 2; pass++){
    const P = libre('prot'), gapP = pT - sumItems(all).p;
    if (P && Math.abs(gapP) >= 1) P.g = Math.max(40, Math.round((P.g + gapP / FOODS[P.id].p * 100) / 5) * 5);
    const C = libre('carb'), gapK = kT - sumItems(all).k;
    if (C && Math.abs(gapK) >= 15) C.g = Math.max(40, Math.round((C.g + gapK / FOODS[C.id].k * 100) / 5) * 5);
  }
}
function basePlan(k, sch, opts = {}){
  const wd = keyToDate(k).getDay(), day = getDay(k);
  const plan = {desayuno:mkItems(DESAYUNO), almuerzo:mkItems(WEEK[wd].almuerzo), cena:mkItems(WEEK[wd].cena)};
  if (sch.order.includes('merienda')) plan.merienda = mkItems(BATIDO);
  const kT = dayKcal(k).k;
  fitToTarget(plan, kT);
  if (opts.noSwaps) return plan;
  for (const m in plan){
    const sw = (day.swaps || {})[m] || {};
    plan[m] = plan[m].map((it, i) => {
      const to = sw[i] && sw[i].id;
      if (to && to !== it.id) return {id:to, g:equiv(it.id, it.g, to), from:it.id, why:'cambio'};
      if (noHay(it.id)){
        // primero algo del mismo grupo que tengas en casa (despensa), luego los alimentos base
        const g = FOODS[it.id].g, key = GROUP_KEY[g] || 'k';
        const enCasa = Object.keys(S.despensa || {}).filter(id => FOODS[id] && FOODS[id].g === g && !noHay(id) && FOODS[id][key] > 0)
          .sort((a, b) => S.despensa[b] - S.despensa[a]);
        const alt = enCasa[0] || (ALTS[g] || []).find(a => a !== it.id && !noHay(a) && (FOODS[a].sec || a === 'agua'));
        if (alt) return {id:alt, g:equiv(it.id, it.g, alt), from:it.id, why:'falta'};
        return Object.assign({}, it, {missing:true});
      }
      return Object.assign({}, it);
    });
  }
  // Con intercambios o cosas que se acaban, el plan se desvía del objetivo: se vuelve a cuadrar aquí, para que
  // el plan del día ya sume el objetivo y el motor no muestre «ajustes» cuando aún no se ha comido nada.
  if (Object.values(plan).some(items => items.some(it => it.from))) fitToTarget(plan, kT);
  return plan;
}

/* ===================== Compensación entre días ===================== */
// Lo que te pasas (o te quedas corto) un día se compensa a medias en los 3 días siguientes: la mitad, repartida,
// con un tope de −250 kcal/día (o +150 si te quedaste corto: en volumen no hace falta recuperarlo todo).
// La proteína no se toca. Solo cuentan los días con desayuno, almuerzo y cena registrados, y el exceso se mide
// contra el objetivo que tenía ese día (ya compensado), para no devolver lo que ya se había compensado.
const COMP = {dias:3, frac:0.5, min:-250, max:150, ruido:150};
const kcalBase = () => +S.settings.kcal || 2500;
const dayComplete = k => !dayIsEmpty(S.days[k]) && !S.days[k].nocuenta && ['desayuno','almuerzo','cena'].every(m => { const l = S.days[k].meals[m]; return l && l.status !== 'pending'; });
const consumedK = k => Object.values(S.days[k].meals).reduce((a, l) => a + consumedOf(l).k, 0) + copasOf(S.days[k]).k;
// → {k: objetivo del día, adj: compensación, src: [{k, e}] días que la causan}
function dayKcal(k){
  const base = kcalBase(), adj = {}, exc = {};
  for (let i = 3 * COMP.dias; i >= 0; i--){
    const j = addDays(k, -i);
    let a = 0;
    for (let d = 1; d <= COMP.dias; d++){ const e = exc[addDays(j, -d)]; if (e) a -= e * COMP.frac / COMP.dias; }
    adj[j] = Math.round(Math.max(COMP.min, Math.min(COMP.max, a)) / 10) * 10;
    if (i > 0 && dayComplete(j)){ const e = consumedK(j) - (base + adj[j]); if (Math.abs(e) >= COMP.ruido) exc[j] = e; }
  }
  const src = [];
  for (let d = COMP.dias; d >= 1; d--){ const j = addDays(k, -d); if (exc[j]) src.push({k:j, e:exc[j]}); }
  return {k: base + adj[k], adj: adj[k], src};
}
// Media de lo comido en los últimos 7 días completos (sin hoy)
function weekKcal(){
  const ks = [];
  for (let i = 1; i <= 7; i++){ const k = addDays(dayKey(), -i); if (dayComplete(k)) ks.push(k); }
  return {n: ks.length, avg: ks.length ? ks.reduce((a, k) => a + consumedK(k), 0) / ks.length : 0};
}
// «falta» = se acabó (va a la lista de la compra); «fuera» = quitado de la despensa (no lo compras): el plan lo cambia
const noHay = id => S.pantry[id] === 'falta' || S.pantry[id] === 'fuera';
function consumedOf(log){
  if (!log || log.status === 'pending' || log.status === 'skipped') return ZERO;
  let t = sumItems(log.items || []);
  (log.extra || []).forEach(e => { t = addM(t, {k:e.k, p:e.p, c:e.c, f:e.f}); });
  if (log.other) t = addM(t, {k:log.other.k, p:log.other.p, c:log.other.c, f:log.other.f});
  return t;
}

function computeDay(k){
  const day = getDay(k), sch = computeSchedule(k), plan = basePlan(k, sch);
  let target = ZERO, consumed = ZERO, bal = ZERO;
  const meals = {};
  for (const m of sch.order){
    const t = sch.times[m], planned = sumItems(plan[m]);
    target = addM(target, planned);
    const log = day.meals[m];
    meals[m] = {key:m, t:t.t, status:t.status, merged:!!t.merged, items:plan[m].map(x=>Object.assign({}, x)), base:planned, log, notes:[]};
    if (t.status !== 'pending'){
      const c = consumedOf(log); consumed = addM(consumed, c); bal = addM(bal, addM(c, planned, -1));
      meals[m].items = (log.items || []).map(x=>Object.assign({}, x));
    } else if (day.planEdit && day.planEdit[m] && !t.merged){
      // cantidades fijadas a mano en una comida que aún no has hecho: se respetan tal cual
      // y la diferencia con el plan la absorben las demás comidas pendientes
      const own = day.planEdit[m].filter(x => FOODS[x.id] && x.g > 0).map(x => ({id:x.id, g:x.g}));
      meals[m].items = own; meals[m].locked = true;
      bal = addM(bal, addM(sumItems(own), planned, -1));
    }
  }
  // el batido que no cabe va con la cena
  if (meals.merienda && meals.merienda.merged && meals.cena.status === 'pending'){
    meals.cena.items = meals.cena.items.concat(meals.merienda.items.map(x => Object.assign({}, x, {fromBatido:true})));
    meals.cena.notes.push('Hoy no cabe el batido aparte: <b>tómalo con la cena</b> o justo después.');
  }
  // objetivos del día: los de Ajustes (la suma del plan puede desviarse algo con intercambios y redondeos)
  const comp = dayKcal(k), TK = comp.k, TP = +S.settings.prot || target.p;
  const pending = sch.order.filter(m => meals[m].status === 'pending' && !meals[m].merged && !meals[m].locked);
  const locked = sch.order.filter(m => meals[m].locked);
  const tips = [];
  if (comp.adj){
    const dias = comp.src.map(s => `el ${DAYS_LONG[keyToDate(s.k).getDay()]} ${s.e > 0 ? 'te pasaste' : 'te quedaste corto'} ${R(Math.abs(s.e))} kcal`);
    const lista = dias.length > 1 ? dias.slice(0, -1).join(', ') + ' y ' + dias[dias.length - 1] : dias[0];
    tips.push({cls:'', html:`Objetivo de este día: <b>${R(TK)} kcal</b> (${comp.adj > 0 ? '+' : '−'}${Math.abs(comp.adj)}), porque ${lista}. Compenso la mitad en 3 días; la proteína no cambia.`});
  }
  let added = ZERO;

  // Fiesta: las copas (previstas o ya tomadas) cuentan como algo ya comido. Lo que queda del día recorta hidratos
  // y grasa para hacerles sitio (la proteína no se toca) y lo que no quepa lo compensa la semana.
  const copas = copasOf(day);
  if (copas.k){
    bal = addM(bal, copas);
    tips.push({cls:'', html:`🍸 <b>${copas.n} copa${copas.n === 1 ? '' : 's'} ≈ ${R(copas.k)} kcal</b>. Les hago sitio recortando hidratos y grasa del resto del día, sin tocar la proteína. Lo que no quepa se compensa en los 3 días siguientes. Antes de salir, cena con proteína y bebe agua entre copa y copa.`});
  }
  // 1) Proteína: recuperar lo que falte
  const deficitP = -bal.p;
  if (deficitP > 2 && pending.length){
    let left = deficitP;
    pending.forEach((m, i) => {
      const want = Math.min(40, left / (pending.length - i));
      if (want < 3) return;
      const got = boostProtein(meals[m], want);
      added = addM(added, got); left -= got.p;
    });
    tips.push({cls:'', html:`Te faltaban <b>${R(deficitP)} g de proteína</b> por lo que ha pasado antes. Lo he repartido en lo que queda del día.`});
  }
  // 2) Calorías
  if (pending.length){
    const net = bal.k + added.k;
    if (bal.k < -150){
      const extra = 0.5 * -bal.k - added.k;
      if (extra > 60){
        const got = scaleGroup(pending.map(m=>meals[m]), 'carb', extra, 0.6);
        added = addM(added, got);
        if (got.k > 30) tips.push({cls:'', html:`He recuperado <b>la mitad de las calorías</b> que faltaban (fase de volumen) con algo más de hidratos. La otra mitad no hace falta.`});
      }
    } else if (net > 120){
      const r = trimSurplus(pending.map(m => meals[m]), net, true);
      added = addM(added, r.got);
      if (!copas.k) tips.push({cls:'amber', html:`Vas <b>${R(net)} kcal por encima</b>. He recortado ${r.what} de lo que queda${r.prot ? ' (sigues llegando a tu proteína)' : ', sin tocar la proteína'}.${r.left > 150 ? ` Aun así quedas ${R(r.left)} kcal por encima: no pasa nada, mañana normal.` : ''}`});
    }
  }
  // Recorta kcal de lo que queda, de lo más prescindible a lo menos: hidratos (dejando algo), grasa, fruta,
  // la leche del batido, el resto de hidratos y, si se permite, la proteína que sobre del objetivo. Nunca la verdura.
  function trimSurplus(ms, cut, conProteina){
    let got = ZERO; const hecho = [];
    const paso = (grp, frac, nombre) => { if (cut <= 30) return; const g = scaleGroup(ms, grp, -cut, frac); if (g.k < -5){ got = addM(got, g); cut += g.k; if (!hecho.includes(nombre)) hecho.push(nombre); } };
    paso('carb', 0.6, 'hidratos'); paso('grasa', 1, 'grasa'); paso('fruta', 1, 'fruta'); paso('liq', 1, 'la leche del batido'); paso('carb', 1, 'hidratos');
    let prot = false;
    if (conProteina && cut > 30){
      const pendP = ms.reduce((a, M) => a + sumItems(M.items).p, 0) + locked.reduce((a, m) => a + sumItems(meals[m].items).p, 0);
      const spareP = consumed.p + pendP - TP;
      const protIt = ms.flatMap(M => M.items.filter(it => FOODS[it.id].g === 'prot' && !it.fromBatido));
      const pk = protIt.reduce((a,it) => a + mac(it.id,it.g).k, 0), pp = protIt.reduce((a,it) => a + mac(it.id,it.g).p, 0);
      if (spareP > 8 && pp > 0){ const g = scaleGroup(ms, 'prot', -Math.min(cut, spareP * pk / pp), 0.5); got = addM(got, g); cut += g.k; prot = g.k < 0; if (prot) hecho.push('la proteína que te sobraba'); }
    }
    const what = hecho.length > 1 ? hecho.slice(0, -1).join(', ') + ' y ' + hecho[hecho.length - 1] : (hecho[0] || 'algo');
    return {got, left: Math.max(0, cut), what, prot};
  }
  // 3) Cena tardía
  const late = toMin(S.settings.lateDinner);
  if (meals.cena.status === 'pending' && !meals.cena.locked && meals.cena.t >= late){
    const carbK = meals.cena.items.filter(x=>FOODS[x.id].g==='carb').reduce((a,x)=>a+mac(x.id,x.g).k,0);
    const got = scaleGroup([meals.cena], 'carb', -carbK*0.4, 0.6);
    added = addM(added, got);
    meals.cena.notes.push(`<b>Cena tardía</b>: misma proteína y un 40 % menos de hidratos para dormir mejor.`);
  }
  // Repaso final, anclado al objetivo de Ajustes (no a la suma del plan, que se desvía con los intercambios):
  // 1) proteína hasta el objetivo; 2) kcal hasta el objetivo, recortando o añadiendo en lo que queda.
  const pendLeft = pending.filter(m => meals[m].status === 'pending');
  if (pendLeft.length){
    const sumRest = key => pendLeft.concat(locked).reduce((a, m) => a + sumItems(meals[m].items)[key], 0);
    const fillProt = () => {
      let gap = TP - consumed.p - sumRest('p');
      if (gap > 2){
        pendLeft.slice().reverse().forEach((m, i) => { // de la última comida hacia atrás
          if (gap <= 2) return;
          const got = boostProtein(meals[m], Math.min(40, gap / (pendLeft.length - i)));
          gap -= got.p;
        });
      }
    };
    fillProt();
    {
      const over = consumed.k + copas.k + sumRest('k') - TK;
      if (over > 40){
        const r = trimSurplus(pendLeft.map(m => meals[m]), over, true);
        if (!copas.k && !tips.some(t => t.cls === 'amber') && over - r.left > 60) tips.push({cls:'amber', html:`Vas <b>${R(over)} kcal por encima</b> de tu objetivo. He recortado ${r.what} de lo que queda.${r.left > 150 ? ` Aun así quedas ${R(r.left)} kcal por encima: no pasa nada, mañana normal.` : ''}`});
        fillProt(); // recortar hidratos también quita algo de proteína (pan, pasta, avena): se repone
      } else if (over < -60){
        // falta energía: más hidratos en lo que queda (no en una cena tardía, que va ligera a propósito)
        const ms = pendLeft.filter(m => !(m === 'cena' && meals.cena.t >= late)).map(m => meals[m]);
        const got = scaleGroup(ms, 'carb', -over, 0.8);
        if (got.k > 60 && !tips.some(t => /calorías que faltaban/.test(t.html))) tips.push({cls:'', html:`He recuperado las <b>calorías que faltaban</b> con algo más de hidratos en lo que queda.`});
      }
    }
  }
  // marcar cambios visibles
  for (const m of pending) markDeltas(meals[m]);

  if (day.nocuenta) tips.unshift({cls:'amber', html:'<b>Este día no cuenta</b>: no entra en tus estadísticas, ni en la media de calorías, ni en la compensación de los días siguientes. Apunta lo que quieras o nada.'});
  const remainingPlan = pending.concat(locked).reduce((a,m)=>addM(a, sumItems(meals[m].items)), ZERO);
  locked.forEach(m => meals[m].notes.unshift('✋ Cantidades fijadas por ti: el resto del día se ajusta a ellas.'));
  return {k, sch, meals, target, consumed, remainingPlan, tips, nocuenta: !!day.nocuenta, bal, TK, comp, copas};
}
function computeSchedule(k){ return schedule(k); }

function boostProtein(meal, wantP){
  const items = meal.items;
  if (meal.key === 'desayuno'){
    const g = roundG('claras', wantP / FOODS.claras.p * 100);
    items.push({id:'claras', g, added:true});
    meal.notes.push(`+${amount('claras', g)} de claras para recuperar proteína.`);
    return mac('claras', g);
  }
  if (meal.key === 'merienda'){
    // primero más proteína en polvo (hasta +20 g), luego un yogur proteico si aún falta
    let got = ZERO;
    const w = items.find(x => x.id === 'whey');
    if (w){
      const before = w.g, g = Math.min(before + 20, roundG('whey', before + wantP / FOODS.whey.p * 100));
      if (g > before){ w.orig = w.orig ?? before; w.g = g; got = mac('whey', g - before); meal.notes.push(`+${g - before} g de proteína en polvo en el batido.`); }
    }
    const rest = wantP - got.p;
    if (rest > 5){
      const g = roundG('yogurp', rest / FOODS.yogurp.p * 100);
      items.push({id:'yogurp', g, added:true});
      meal.notes.push(`+${amount('yogurp', g)} para recuperar proteína.`);
      got = addM(got, mac('yogurp', g));
    }
    return got;
  }
  const main = items.filter(x => FOODS[x.id].g === 'prot' && x.id !== 'huevo' && !x.fromBatido).sort((a,b)=>mac(b.id,b.g).p - mac(a.id,a.g).p)[0];
  let got = ZERO;
  if (main){
    // el plato principal crece como mucho un 60 %; el resto va en un extra
    const before = main.g, maxP = mac(main.id, before).p * 0.6;
    const g = roundG(main.id, before + Math.min(wantP, maxP) / FOODS[main.id].p * 100);
    if (g > before){
      main.g = g; main.orig = main.orig ?? before; got = mac(main.id, g - before);
      meal.notes.push(`+${amount(main.id, g - before)} de ${FOODS[main.id].n.toLowerCase()} para recuperar proteína.`);
    }
  }
  const rest = wantP - got.p;
  if (rest > 5){
    const extra = items.some(x => x.id === 'huevo') ? 'claras' : 'atun';
    const g = roundG(extra, rest / FOODS[extra].p * 100);
    items.push({id:extra, g, added:true});
    meal.notes.push(`+${amount(extra, g)} de ${FOODS[extra].n.toLowerCase()}${extra === 'claras' ? ' (en la tortilla con los huevos)' : ''}.`);
    got = addM(got, mac(extra, g));
  }
  return got;
}
// reparte deltaK (kcal, +/-) entre los alimentos de un grupo; maxFrac = cambio máximo relativo
function scaleGroup(meals, grp, deltaK, maxFrac){
  const cands = [];
  meals.forEach(m => m.items.forEach(it => { if (FOODS[it.id].g === grp && !it.fromBatido) cands.push(it); }));
  const totK = cands.reduce((a,it)=>a+mac(it.id,it.g).k,0);
  if (!totK) return ZERO;
  let frac = deltaK / totK;
  frac = Math.max(-maxFrac, Math.min(maxFrac, frac));
  let res = ZERO;
  cands.forEach(it => {
    const before = it.g, g = roundG(it.id, before * (1 + frac));
    if (g === before) return;
    it.orig = it.orig ?? before; it.g = g;
    res = addM(res, addM(mac(it.id, g), mac(it.id, before), -1));
  });
  return res;
}
function markDeltas(meal){
  meal.items.forEach(it => { if (it.orig != null && it.orig !== it.g) it.delta = it.g - it.orig; });
}

let TAB = 'hoy';
const app = document.getElementById('app');
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === TAB ? 'page' : 'false'));
  applyTheme();
  ({hoy:renderHoy, compra:renderCompra, progreso:renderProgreso, ajustes:renderAjustes})[TAB]();
  queueSync();
}
function applyTheme(){ const t = S.settings.theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

const dayIsEmpty = x => !x || (!Object.keys(x.meals || {}).length && !x.train && !x.wake && !x.nocuenta && !x.fiesta && !Object.keys(x.swaps || {}).length && !Object.keys(x.planEdit || {}).length);
function renderHoy(){
  const k = viewDay(), isToday = k === dayKey(), existed = !!S.days[k];
  const D = computeDay(k), day = getDay(k), now = nowFor(k);
  if (!existed && dayIsEmpty(day)) delete S.days[k]; // mirar un día no lo crea
  const d = keyToDate(k);
  // el objetivo que se ve es el de Ajustes; el plan del día queda a ±15 kcal y ±1 g de él tras el ajuste fino
  const pT = +S.settings.prot || D.target.p, pC = D.consumed.p, kT = D.TK, kC = D.consumed.k + D.copas.k;
  // «Faltan» = objetivo − lo comido. Si lo que queda del plan no lo cubre exactamente (p. ej. en volumen solo se
  // recupera la mitad de las kcal perdidas, o ya no quedan comidas), se dice aparte para que las cifras cuadren.
  const pLeft = pT - pC, kLeft = kT - kC, hayPend = D.remainingPlan.k > 0;
  const pTxt = pLeft <= 2 ? '✓ Objetivo cumplido'
    : !hayPend ? `Te quedaste a <b class="num">${R(pLeft)} g</b>`
    : `Faltan <b class="num">${R(pLeft)} g</b>`;
  const kTxt = kLeft < -50 ? `Llevas <b class="num">${R(-kLeft)} kcal</b> de más`
    : !hayPend && kLeft <= 50 ? '✓ En tu objetivo'
    : !hayPend ? `Te quedaste a <b class="num">${R(kLeft)} kcal</b>`
    : `Faltan <b class="num">${R(Math.max(0, kLeft))} kcal</b>`;
  // total del día si comes lo que queda tal como está apuntado (lo comido + lo pendiente)
  const fin = hayPend ? addM(D.consumed, D.remainingPlan) : null;
  const finTxt = (v, u) => fin ? `<div class="small muted">Con lo apuntado: <b class="num">${R(v)}${u}</b></div>` : '';
  const tr = D.sch.tr;
  const titulo = isToday ? 'Hoy' : k === addDays(dayKey(), -1) ? 'Ayer' : DAYS_LONG[d.getDay()][0].toUpperCase() + DAYS_LONG[d.getDay()].slice(1);
  let h = `<header class="top"><div class="daynav"><button class="navb" data-act="dayprev" aria-label="Día anterior">‹</button>
      <div><h1>${titulo}</h1><div class="sub">${DAYS_LONG[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</div></div>
      <button class="navb" data-act="daynext" aria-label="Día siguiente" ${isToday ? 'disabled' : ''}>›</button></div>
    <button class="chip ${D.nocuenta?'on':''}" data-act="nocuenta">${D.nocuenta?'🚫 No cuenta':'Día normal'}</button></header>
  ${isToday ? '' : `<ul class="tips"><li class="amber">Estás viendo un <b>día pasado</b>. Lo que marques aquí corrige tu historial. <button class="stp-reset" data-act="daytoday">Volver a hoy</button></li></ul>`}
  <div class="chips">
    <button class="chip" data-act="wake">☀️ ${day.wake ? 'Levantado ' + day.wake : 'Despertar ' + S.settings.wake}</button>
    <button class="chip ${tr.on?'on':''}" data-act="train">🏋️ ${tr.on ? (tr.done ? 'Entrenado ' : 'Entreno ') + fmt(tr.start) : 'Descanso'}</button>
    <button class="chip ${D.copas.n?'on':''}" data-act="fiesta">🍸 ${D.copas.n ? D.copas.n + ' copa' + (D.copas.n === 1 ? '' : 's') : 'Fiesta'}</button>
  </div>
  <section class="card hero" aria-label="Resumen">
    <div><div class="lbl">Proteína</div><div class="big num">${R(pC)}<span class="muted" style="font-size:20px"> / ${R(pT)} g</span></div>
      <div class="bar"><i style="width:${Math.min(100, pC/pT*100)}%"></i></div>
      <div class="small">${pTxt}</div>${finTxt(fin && fin.p, ' g')}</div>
    <div><div class="lbl">Calorías</div><div class="big num">${R(kC)}<span class="muted" style="font-size:20px"> / ${R(kT)}</span></div>
      <div class="bar k"><i style="width:${Math.min(100, kC/kT*100)}%"></i></div>
      <div class="small">${kTxt}</div>${finTxt(fin && fin.k, ' kcal')}</div>
    <div class="macros num"><span>Hidratos ${R(D.consumed.c)}/${R(D.target.c)} g</span><span>Grasa ${R(D.consumed.f)}/${R(D.target.f)} g</span></div>
  </section>`;
  // avisos inteligentes
  const tips = D.tips.slice();
  const pend = D.sch.order.filter(m => D.meals[m].status === 'pending' && !D.meals[m].merged);
  const overdue = pend.filter(m => now > D.meals[m].t + 45);
  if (!isToday){ if (pend.length) tips.push({cls:'', html:`Quedaron <b>${pend.length} comida${pend.length === 1 ? '' : 's'} sin registrar</b>. Si las hiciste, márcalas para que tu historial y el % de Progreso sean reales.`}); }
  else if (overdue.length) tips.push({cls:'amber', html:`<b>${MEAL_NAME[overdue[0]]}</b> sigue pendiente desde las ${fmt(D.meals[overdue[0]].t)}. Márcala o desliza para recolocar el día.`});
  if (isToday && tr.on && !tr.done && now > tr.start + tr.dur + 30) tips.push({cls:'amber', html:`¿Has entrenado? Toca el entreno para confirmarlo o cambiarlo.`});
  if (isToday && now >= toMin('21:30') && pLeft > 25 && pend.length <= 1) tips.push({cls:'coral', html:`Te quedan <b>${R(pLeft)} g de proteína</b>. Si no te entra la cena entera, prioriza el pescado/carne y los huevos.`});
  if (tips.length) h += `<ul class="tips">${tips.map(t=>`<li class="${t.cls}">${t.html}</li>`).join('')}</ul>`;

  // línea del día
  const events = [];
  for (const m of D.sch.order) if (!D.meals[m].merged) events.push({t:D.meals[m].t, type:'meal', m});
  if (tr.on) events.push({t:tr.start, type:'train'});
  if (isToday) events.push({t:bedMin(), type:'sleep'});
  events.sort((a,b)=>a.t-b.t || (a.type==='train'?-1:1));
  h += `<div class="timeline">`;
  for (const e of events){
    if (e.type === 'train'){
      h += `<div class="ev trainev ${tr.done?'dim':''}"><div class="card" data-act="train" role="button" tabindex="0"><div class="evhead"><div class="evtime num">${fmt(tr.start)}</div><div class="evname">🏋️ Entreno</div><span class="badge ${tr.done?'done':''}">${tr.done?'Hecho':fmt(tr.start+tr.dur)}</span></div>
        <div class="evnote">${tr.done ? 'Buen trabajo. El batido sigue al entreno.' : 'Toca para cambiar la hora, moverlo o marcarlo como hecho.'}</div></div></div>`;
    } else if (e.type === 'sleep'){
      h += `<div class="ev sleep"><div class="card"><div class="evhead"><div class="evtime num">${fmt(bedMin())}</div><div class="evname">🌙 A dormir</div><span class="badge">${fmt(toMin(S.settings.wake))}</span></div><div class="evnote">Desconecta pantallas 30 min antes. Objetivo: 8 h.</div></div></div>`;
    } else h += mealCard(D.meals[e.m], now);
  }
  h += `</div>`;
  app.innerHTML = h;
  bindSwipes(); bindLongPress();
}
function mealCard(M, now){
  const st = M.status;
  const badge = st === 'done' ? `<span class="badge done">✓ ${fmt(M.t)}</span>`
    : st === 'changed' ? `<span class="badge done">✓ con cambios</span>`
    : st === 'other' ? `<span class="badge done">✓ otra cosa</span>`
    : st === 'skipped' ? `<span class="badge skip">Saltada</span>`
    : st === 'moved' ? `<span class="badge done">↪ con ${MEAL_NAME[M.log.to].toLowerCase()}</span>`
    : now >= 29 * 60 ? `<span class="badge late">Sin registrar</span>`
    : now > M.t + 45 ? `<span class="badge late">Pendiente</span>` : '';
  // macros de la comida: lo previsto si está pendiente, lo comido si ya está registrada
  const mt = st === 'pending' ? sumItems(M.items) : st === 'skipped' || st === 'moved' ? null : consumedOf(M.log);
  const macros = mt ? `<div class="mm num"><span><b>${R(mt.k)}</b> kcal</span><span><b>${R(mt.p)}</b> g P</span><span><b>${R(mt.c)}</b> g H</span><span><b>${R(mt.f)}</b> g G</span></div>` : '';
  let items = '';
  if (st !== 'pending' && st !== 'skipped'){
    const rows = M.items.map(it => `<li><span>${esc(dispName(it.id))}</span><span class="amt num">${amount(it.id, it.g)}</span></li>`);
    (M.log && M.log.extra || []).forEach(e => rows.push(`<li><span>${esc(e.n)}</span><span class="amt num">${R(e.g)} g · ${R(e.k)} kcal</span></li>`));
    if (M.log && M.log.other) rows.push(`<li><span>${esc(M.log.other.label)}</span><span class="amt num">${R(M.log.other.k)} kcal · ${R(M.log.other.p)} g prot.</span></li>`);
    if (rows.length) items = `<ul class="items">${rows.join('')}</ul>`;
    if (M.log && M.log.resumen) items += `<div class="evnote">✨ ${esc(M.log.resumen)}</div>`;
  }
  else if (st !== 'skipped') items = `<ul class="items">${M.items.map((it,i)=>{
      const cls = it.added ? 'plus' : it.delta > 0 ? 'plus' : it.delta < 0 ? 'minus' : it.missing ? 'miss' : '';
      const amt = it.added ? '+' + amount(it.id, it.g) : it.delta ? `<s>${amount(it.id, it.orig)}</s> ${amount(it.id, it.g)}` : amount(it.id, it.g);
      const sub = it.from ? ` <span class="muted" style="font-size:12px">(${it.why==='falta'?'no hay ':'en vez de '}${esc(FOODS[it.from].n.toLowerCase())})</span>` : it.missing ? ' <span style="font-size:12px">(no hay)</span>' : '';
      const name = esc(dispName(it.id)) + sub;
      // − / + para cambiar la cantidad sin marcar la comida: el resto del día se recoloca al momento
      const stp = d => `<button class="stp" data-act="qty" data-m="${M.key}" data-i="${i}" data-d="${d}" aria-label="${d < 0 ? 'Menos' : 'Más'} ${esc(dispName(it.id))}">${d < 0 ? '−' : '+'}</button>`;
      return st === 'pending' && !it.fromBatido
        ? `<li class="${cls} mv" data-move="${M.key}" data-i="${i}">${it.added && !M.locked ? `<span>${name}</span>` : `<button data-act="swap" data-m="${M.key}" data-i="${i}">${name}</button>`}<span class="qty">${stp(-1)}<button class="amt num qamt" data-act="qtyset" data-m="${M.key}" data-i="${i}" aria-label="Escribir la cantidad de ${esc(dispName(it.id))}">${amt}</button>${stp(1)}</span></li>`
        : `<li class="${cls}"><span>${name}</span><span class="amt num">${amt}</span></li>`;
    }).join('')}</ul>`;
  const notes = M.notes.length && st === 'pending' ? `<div class="evnote">${M.notes.join('<br>')}${M.locked ? ` <button class="stp-reset" data-act="planreset" data-m="${M.key}">Volver al plan</button>` : ''}</div>` : '';
  const actions = st === 'pending'
    ? `<div class="evactions"><button class="btn pri" data-act="done" data-m="${M.key}">✓ Hecha</button><button class="btn sm" data-act="foto" data-m="${M.key}" aria-label="Foto de lo que he comido">📷</button><button class="btn sm" data-act="coach" data-m="${M.key}" aria-label="¿Cómo completo lo que me falta?">✨</button><button class="btn sm" data-act="more" data-m="${M.key}" aria-label="Más opciones">Opciones</button></div>`
    : `<div class="evactions"><button class="btn sm ghost" data-act="undo" data-m="${M.key}">Deshacer</button></div>`;
  return `<div class="ev ${st!=='pending'?'dim':''}" data-swipe="${st==='pending'?M.key:''}"><div class="swipebg">✓ Hecha</div><div class="card">
    <div class="evhead"><div class="evtime num">${fmt(M.t)}</div><div class="evname">${MEAL_NAME[M.key]}</div>${badge}</div>${macros}${items}${notes}${actions}</div></div>`;
}

/* ===================== Acciones de comidas ===================== */
// Cantidades fijadas a mano en una comida pendiente (day.planEdit[m]). La primera vez se copia lo que se ve.
function planItems(m){
  const day = getDay(viewDay());
  day.planEdit = day.planEdit || {};
  if (!day.planEdit[m]) day.planEdit[m] = computeDay(viewDay()).meals[m].items.filter(x => !x.fromBatido).map(x => ({id:x.id, g:x.g}));
  return day.planEdit[m];
}
function qtyStep(id, g){ const F = FOODS[id]; return F.u ? F.u : g < 60 ? 5 : g < 200 ? 10 : 25; }
function changeQty(m, i, dir){
  const items = planItems(m), it = items[i]; if (!it) return;
  const step = qtyStep(it.id, it.g);
  it.g = Math.max(0, FOODS[it.id].u ? Math.round(it.g / step) * step + dir * step : Math.round((it.g + dir * step) / 5) * 5);
  if (it.g <= 0){ items.splice(i, 1); toast(FOODS[it.id].n + ' quitado de esta comida'); }
  save(); render();
}
// Tocar la cantidad: escribirla exacta (en gramos/ml, o en unidades si el alimento va por piezas)
function sheetQty(m, i){
  const it = planItems(m)[i]; if (!it) return;
  const F = FOODS[it.id], uni = F.u ? F.un[1] : F.ml ? 'ml' : 'g';
  sheet(`<h2>${esc(dispName(it.id))}</h2><div class="sub">${MEAL_NAME[m]}: cantidad exacta. El resto del día se recoloca.</div>
    <div class="row"><input id="qv" type="number" inputmode="decimal" min="0" step="${F.u ? 1 : 1}" value="${F.u ? Math.round(it.g / F.u) : R(it.g)}" style="flex:1"><span class="muted">${uni}</span></div>
    <div class="evactions"><button class="btn ghost" data-x="cancel">Cancelar</button><button class="btn pri" data-x="ok">Guardar</button></div>`, el => {
    const inp = el.querySelector('#qv'); inp.focus(); inp.select();
    const ok = () => {
      const v = parseFloat(String(inp.value).replace(',', '.'));
      if (!(v >= 0)) return toast('Escribe un número');
      const items = planItems(m);
      if (v === 0){ items.splice(i, 1); toast(F.n + ' quitado de esta comida'); }
      else items[i].g = F.u ? Math.round(v) * F.u : Math.round(v);
      save(); closeSheet(); render();
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    el.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; if (x.dataset.x === 'ok') ok(); else closeSheet(); });
  });
}
function logMeal(m, status, extra = {}){
  const k = viewDay(), day = getDay(k), D = computeDay(k);
  const prev = day.meals[m] ? structuredClone(day.meals[m]) : null;
  const items = D.meals[m].items.map(x => ({id:x.id, g:x.g}));
  day.meals[m] = Object.assign({status, at: extra.at ?? (k === dayKey() ? nowMin() : D.meals[m].t), items}, extra);
  if (status === 'skipped') { day.meals[m].items = []; delete day.meals[m].at; }
  day.meals[m].items.forEach(it => { if (FOODS[it.id] && FOODS[it.id].mid) keepFood(it.id); });
  const prevEdit = day.planEdit && day.planEdit[m]; if (prevEdit) delete day.planEdit[m]; // ya está registrada
  // marcar el batido como tomado si iba con la cena
  if (m === 'cena' && D.meals.merienda && D.meals.merienda.merged && status !== 'skipped'){
    day.meals.merienda = {status:'done', at: day.meals[m].at, items: []};
  }
  save(); render();
  toast(status === 'skipped' ? MEAL_NAME[m] + ' saltada: recoloco el día' : MEAL_NAME[m] + ' registrada', () => {
    if (prev) day.meals[m] = prev; else delete day.meals[m];
    if (prevEdit){ day.planEdit = day.planEdit || {}; day.planEdit[m] = prevEdit; }
    save(); render();
  });
}

let sheetCleanup = null; // p. ej. apagar la cámara al cerrar o cambiar de hoja
function runCleanup(){ if (sheetCleanup){ const f = sheetCleanup; sheetCleanup = null; try{ f(); }catch(_){} } }
function sheet(html, onMount){
  runCleanup();
  const root = document.getElementById('sheet-root');
  root.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const bg = root.firstChild;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  if (onMount) onMount(bg.querySelector('.sheet'));
}
function closeSheet(){ runCleanup(); document.getElementById('sheet-root').innerHTML = ''; }
const timeInput = (id, val) => `<input type="time" id="${id}" value="${fmt(val)}">`;

function sheetMore(m){
  const k = viewDay(), D = computeDay(k), M = D.meals[m];

  <div class="stack">

  </div>
  <div class="muted" style="font-size:13px;margin-top:10px">¿Comiste lo del plan con cambios? Ajusta las cantidades en la tarjeta (−/+ o tocando el número) y dale a <b>Hecha</b>.</div>
  <div id="atbox" hidden><label class="f">¿A qué hora?</label><div class="row">${timeInput('at', Math.min(nowFor(viewDay()), M.t))}<button class="btn pri" data-x="atok">Guardar</button></div></div>`, el => {
    el.addEventListener('click', e => {
      const x = e.target.closest('[data-x]'); if (!x) return;

// Lista de resultados del buscador (alimentos del plan + Mercadona). onPick(id) al tocar uno.
function foodResults(el, sel, ids, extraHtml = () => ''){
  el.querySelector(sel).innerHTML = ids.length ? ids.map(id => { const F = useMDB(id) || FOODS[id];
    return `<button class="opt" data-pick="${id}"><span>${(S.despensa || {})[id] ? '🏠 ' : ''}${esc(F.n)}${F.q === 'b' ? ' <span class="muted" style="font-size:12px">(dato aproximado)</span>' : ''}${F.tal ? ' <span class="muted" style="font-size:12px">(sin escurrir)</span>' : ''}</span><span class="d num">${extraHtml(id, F) || `${R(F.k)} kcal · ${R(F.p)} g P`}</span></button>`; }).join('')
    : `<div class="empty">Sin resultados</div>`;
}
// mode 'log' = registrar lo que has comido · 'plan' = fijar lo que vas a comer, sin marcarla como hecha
function sheetEdit(m, init = null, mode = 'log'){
  const k = viewDay(), D = computeDay(k), plan = mode === 'plan';
  let items = init || D.meals[m].items.filter(x => !(plan && x.fromBatido)).map(x => ({id:x.id, g:x.g}));
  const sum = el => { const t = sumItems(items); el.querySelector('#edsum').textContent = `${R(t.k)} kcal · ${R(t.p)} g proteína`; };
  const draw = el => {
    el.querySelector('#ed').innerHTML = items.map((it,i)=>{
      const F = FOODS[it.id], val = F.u ? Math.round(it.g/F.u) : R(it.g);
      return `<div class="row" style="margin-bottom:8px"><div style="flex:1">${esc(dispName(it.id))}</div>
        <input type="number" inputmode="decimal" min="0" step="${F.u?1:5}" value="${val}" data-i="${i}" style="width:92px">
        <span class="muted" style="width:52px;font-size:13px">${F.u?F.un[1]:F.ml?'ml':'g'}</span>
        <button class="btn sm ghost" data-del="${i}" aria-label="Quitar">✕</button></div>`; }).join('');
    sum(el);
  };
  sheet(`<h2>${plan ? MEAL_NAME[m] + ': añadir alimentos' : MEAL_NAME[m] + ' con cambios'}</h2><div class="sub">${plan ? 'Busca o escanea lo que quieras añadir. No se marca como hecha: el resto del día se recoloca con esto.' : 'Pon lo que has comido de verdad.'}</div>
    <div id="ed"></div>
    <label class="f">Añadir alimento</label>
    <div class="row"><input id="addq" type="search" placeholder="Busca: pavo, yogur proteínas, tortitas…" autocomplete="off"><button class="btn sm" data-x="scan" aria-label="Escanear código">📷</button></div>
    <div id="addres" class="stack" style="margin-top:8px"></div>
    <div class="muted num" id="edsum" style="margin:14px 0 8px"></div>
    ${plan ? '' : `<label class="f">Hora</label>${timeInput('at', Math.min(nowFor(viewDay()), D.meals[m].t))}`}
    <div class="evactions"><button class="btn ghost" data-x="cancel">Cancelar</button><button class="btn pri" data-x="ok">${plan ? 'Aplicar al plan' : 'Guardar'}</button></div>`, el => {
    draw(el);
    if (plan) el.querySelector('#addq').focus();
    const showRes = () => { const q = el.querySelector('#addq').value.trim(); if (!q){ el.querySelector('#addres').innerHTML = ''; return; } foodResults(el, '#addres', searchFoods(q, {limit:12})); };
    loadMDB().then(showRes).catch(() => {});
    el.querySelector('#addq').addEventListener('input', showRes);
    el.addEventListener('input', e => { const i = e.target.dataset.i; if (i == null) return; const F = FOODS[items[i].id]; const v = parseFloat(e.target.value) || 0; items[i].g = F.u ? v*F.u : v; sum(el); });
    el.addEventListener('click', e => {
      if (e.target.dataset.del != null){ items.splice(+e.target.dataset.del, 1); draw(el); return; }
      const p = e.target.closest('[data-pick]');
      if (p){ const id = p.dataset.pick; useMDB(id); items.push({id, g: FOODS[id].u || 100}); el.querySelector('#addq').value = ''; el.querySelector('#addres').innerHTML = ''; draw(el); return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'scan') return sheetScan(id => sheetEdit(m, items.concat({id, g:FOODS[id].u || 100}), mode));
      if (x.dataset.x === 'cancel') closeSheet();
      if (x.dataset.x === 'ok' && plan){
        const day = getDay(k); day.planEdit = day.planEdit || {};
        day.planEdit[m] = items.filter(i => i.g > 0);
        day.planEdit[m].forEach(i => { if (FOODS[i.id].mid) keepFood(i.id); });
        save(); closeSheet(); render(); toast(MEAL_NAME[m] + ' planificada: el resto del día se ha recolocado');
      }
      else if (x.dataset.x === 'ok'){ let t = toMin(el.querySelector('#at').value); if (t < 300) t += 1440; closeSheet(); logMeal(m, 'changed', {at:t, items:items.filter(i=>i.g>0)}); }
    });
  });
}

// Escáner de códigos de barras (BarcodeDetector de Chrome en Android). Busca el EAN en la base, sin IA.
function sheetScan(onFound, hint = ''){
  sheet(`<h2>📷 Escanear código de barras</h2><div class="sub">Apunta al código del envase. ${esc(hint)}</div>
    <video id="cam" playsinline muted style="width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
    <div id="scst" class="muted" style="font-size:13px;margin-top:8px">Abriendo la cámara…</div>
    <label class="f">O escribe el número del código</label>
    <div class="row"><input id="eanin" inputmode="numeric" placeholder="8480000…" autocomplete="off"><button class="btn sm" data-x="ean">Buscar</button></div>
    <div class="evactions"><button class="btn ghost" data-x="cancel">Cerrar</button></div>`, async el => {
    let stream = null, stop = false;
    const off = () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); };
    sheetCleanup = off;
    const st = txt => { const s = el.querySelector('#scst'); if (s) s.textContent = txt; };
    const found = async code => {
      try{ await loadMDB(); }catch(_){ st('No se ha podido cargar la base de alimentos (¿sin conexión?).'); return false; }
      const x = MDB.byEan[code] || MDB.byEan[code.padStart(13, '0')] || MDB.byEan[code.replace(/^0+/, '')];
      if (!x){ st(`El código ${code} no está en la base. Puedes contárselo a la IA o hacerle una foto a la etiqueta.`); return false; }
      off(); useMDB(x.id); keepFood(x.id); save(); onFound(x.id); return true;
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      if (b.dataset.x === 'cancel') closeSheet();
      if (b.dataset.x === 'ean'){ const v = el.querySelector('#eanin').value.replace(/\D/g, ''); if (v) found(v); }
    });
    if (!('BarcodeDetector' in window) || !navigator.mediaDevices){ st('Este navegador no lee códigos de barras: escribe el número que hay debajo del código.'); el.querySelector('#cam').hidden = true; return; }
    try{
      const det = new BarcodeDetector({formats:['ean_13', 'ean_8', 'upc_a', 'upc_e']});
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
      if (stop){ off(); return; }
      const v = el.querySelector('#cam'); v.srcObject = stream; await v.play();
      st('Buscando un código…');
      let last = '';
      while (!stop){
        const codes = await det.detect(v).catch(() => []);
        if (codes.length && codes[0].rawValue !== last){ last = codes[0].rawValue; if (await found(last)) break; }
        await new Promise(r => setTimeout(r, 250));
      }
    }catch(err){ st('No se pudo abrir la cámara: ' + (err.message || err) + '. Escribe el número del código.'); }
  });
}

      closeSheet(); logMeal(m, 'other', {at:t, other:o, items:[]});
    });
  });
}

function sheetSwap(m, i){
  const k = viewDay(), D = computeDay(k), it = D.meals[m].items[i], locked = !!D.meals[m].locked;
  // en una comida con cantidades fijadas se cambia lo que hay ahora; si no, se parte del plan original
  const base = locked ? it : basePlan(k, D.sch, {noSwaps:true})[m][i];
  const orig = base.id, origG = base.g;
  const grp = FOODS[orig].g;
  const alts = (ALTS[grp] || []).filter(a => FOODS[a].sec || a === 'agua');
  sheet(`<h2>Cambiar ${esc(dispName(it.id).toLowerCase())}</h2><div class="sub">Equivalencias de ${(GROUP_NAME[grp] || 'alimento').toLowerCase()} con la misma cantidad de ${({p:'proteína',c:'hidratos',f:'grasa'})[GROUP_KEY[grp]] || 'volumen'}.</div>
    <div class="stack">${alts.map(a=>{ const g = a === orig ? origG : equiv(orig, origG, a); const miss = noHay(a);
      return `<button class="opt ${a===it.id?'sel':''}" data-a="${a}" data-g="${g}"><span>${esc(FOODS[a].n)}${miss?' <span style="color:var(--coral);font-size:12px">(no hay)</span>':''}</span><span class="d num">${amount(a,g)}</span></button>`; }).join('')}</div>
    ${FOODS_BASE[orig] && !locked ? `<button class="opt" data-x="base" style="margin-top:10px"><span>🛒 Cambiar el producto en la dieta base</span><span class="d">todos los días</span></button>` : ''}
    <h3 class="sec">Solo hoy: más opciones de Mercadona</h3>
    <div class="row"><input id="swq" type="search" placeholder="Busca o elige: pavo, sepia, tofu…" autocomplete="off"><button class="btn sm" data-x="scan" aria-label="Escanear un producto">📷</button></div>
    <div id="swres" class="stack" style="margin-top:8px"><div class="empty">Cargando productos…</div></div>
    <div class="evactions"><button class="btn danger" data-x="falta">No tengo ${esc(dispName(it.id).toLowerCase())}</button></div>`, el => {
    const drawMdb = () => {
      // sin búsqueda: primero lo que se parece al alimento original (variantes reales del mismo producto)
      const q = el.querySelector('#swq').value.trim() || FOODS[orig].n;
      // lo que tienes en casa del mismo grupo va primero (🏠)
      const enCasa = el.querySelector('#swq').value.trim() ? [] : Object.keys(S.despensa || {}).filter(id => FOODS[id] && FOODS[id].g === grp && !noHay(id));
      const ids = enCasa.concat(searchFoods(q, {group:grp, limit:20, base:false})).filter((v, j, a) => a.indexOf(v) === j)
        .filter(id => { const F = useMDB(id) || FOODS[id]; return F && F.q !== 'b' && F[GROUP_KEY[grp] || 'k'] > 0; });
      foodResults(el, '#swres', ids, id => amount(id, equiv(orig, origG, id)));
    };
    loadMDB().then(drawMdb).catch(() => { el.querySelector('#swres').innerHTML = '<div class="empty">Sin conexión: la base de Mercadona se descarga la primera vez que la usas.</div>'; });
    el.querySelector('#swq').addEventListener('input', () => { if (MDB) drawMdb(); });
    const day = getDay(k);
    const apply = to => {
      if (locked){ const pe = planItems(m); if (pe[i]) pe[i] = {id:to, g:equiv(orig, origG, to)}; if (FOODS[to].mid) keepFood(to); }
      else {
        day.swaps = day.swaps || {}; day.swaps[m] = day.swaps[m] || {};
        if (to === orig) delete day.swaps[m][i]; else { day.swaps[m][i] = {id:to}; keepFood(to); }
      }
      save(); closeSheet(); render();
    };
    el.addEventListener('click', e => {
      const pick = e.target.closest('[data-pick]');
      const a = e.target.closest('[data-a]') || (pick && {dataset:{a:pick.dataset.pick}});
      if (a) return apply(a.dataset.a);
      const x = e.target.closest('[data-x]');
      // escanear: se cambia por lo escaneado, con la cantidad equivalente en el macro principal del grupo
      if (x && x.dataset.x === 'scan') return sheetScan(to => { apply(to); const nu = computeDay(k).meals[m].items[i]; toast(`${FOODS[orig].n} → ${FOODS[to].n}` + (nu && nu.id === to ? ` (${amount(to, nu.g)})` : '')); }, 'Se cambia por la cantidad equivalente.');
      if (x && x.dataset.x === 'base') return sheetLink(orig);
      if (x && x.dataset.x === 'falta'){ S.pantry[it.id] = 'falta'; if (day.swaps && day.swaps[m]) delete day.swaps[m][i]; save(); closeSheet(); render(); toast(FOODS[it.id].n + ' añadido a la lista de la compra'); }
    });
  });
}
